) gateway ws:// được normalize rồi mới so allowlist"},{"id":"49","name":"config — validateRunRequest message CHÍNH XÁC (T-11 — diệt string mutant) cảnh báo matching seat: chat=0 → KHÔNG warning; target đúng biên 10_000 → KHÔNG warning; seat == duration → KHÔNG warning"},{"id":"50","name":"config — buildRunConfig nhánh (T-11) freshAccounts=true → useExistingAccounts=false; ngược lại true"},{"id":"51","name":"config — buildRunConfig nhánh (T-11) registerRamp bị clamp theo maxRegisterRamp"},{"id":"52","name":"config — buildRunConfig nhánh (T-11) profile merge với DEFAULT_PROFILE (field thiếu → default)"},{"id":"53","name":"config — buildRunConfig nhánh (T-11) seed + createdAt là số"},{"id":"54","name":"config — resolveWorkerCount / estimateInfra (T-11) workerCount cấu hình thắng auto"},{"id":"55","name":"config — resolveWorkerCount / estimateInfra (T-11) auto: clamp theo target/socketsPerWorker và 32"},{"id":"56","name":"config — resolveWorkerCount / estimateInfra (T-11) auto: giá trị CHÍNH XÁC với availableParallelism mock (diệt mutant min/max/||)"},{"id":"57","name":"config — resolveWorkerCount / estimateInfra (T-11) estimateInfra: workers/ramGB/seatMin"},{"id":"58","name":"config — settings file allowlist (SD-1, T-11) saveSettings → loadSettings roundtrip"},{"id":"59","name":"config — settings file allowlist (SD-1, T-11) file hỏng (không phải JSON) → default { allowlist: [], updatedAt: 0 }"},{"id":"60","name":"config — settings file allowlist (SD-1, T-11) mergedAllowlist: env + settings, dedupe, normalize ws→http"},{"id":"61","name":"config — misc (T-11) isKnownBadDbUrl: placeholder + default credential cũ → true; dev thật → false"},{"id":"62","name":"config — misc (T-11) PRESETS: 1M/10M requiresCluster, label đúng"}],"source":"import { describe, it, expect, vi } from 'vitest';\nimport * as fs from 'node:fs';\nimport * as os from 'node:os';\nimport * as path from 'node:path';\n\n// T-11: mock availableParallelism để assert resolveWorkerCount CHÍNH XÁC (diệt mutant min/max/||).\nvi.mock('node:os', async (importOriginal) => {\n  const actual = await importOriginal<"+"typeof import('node:os')>();\n  return { ...actual, availableParallelism: vi.fn(() => 100) };\n});\n\nimport {\n  getEnv,\n  validateEnv,\n  newRunId,\n  validateRunRequest,\n  buildRunConfig,\n  resolveWorkerCount,\n  estimateInfra,\n  loadDotEnv,\n  loadSettings,\n  saveSettings,\n  mergedAllowlist,\n  isKnownBadDbUrl,\n  PRESETS,\n  DEFAULT_PROFILE,\n  PLACEHOLDER_DB_URL,\n  DEFAULT_DEV_DB_URL,\n  mergeEnvSources,\n} from '../config';\nimport type { StartRunRequest } from '../types';\nimport { normalizeUrl, redactUrl } from '../util';\n\nfunction baseReq(over: Partial<"+"StartRunRequest> = {}): StartRunRequest {\n  return {\n    targetUsers: 10_000,\n    rampRate: 200,\n    rampMode: 'rate',\n    durationMin: 30,\n    profile: { ...DEFAULT_PROFILE },\n    gatewayUrl: 'ws://localhost:3000',\n    ...over,\n  };\n}\n\ndescribe('config — env', () => {\n  it('đọc env override + allowlist mặc định localhost', () => {\n    const env = getEnv({\n      LOADTEST_PORT: '3456',\n      LOADTEST_MAX_TARGET: '50000',\n      LOADTEST_ALLOWLIST: '',\n    });\n    expect(env.port).toBe(3456);\n    expect(env.maxTarget).toBe(50_000);\n    expect(env.allowlist).toContain('http://localhost:3000');\n  });\n\n  it('allowlist từ env phân tách phẩy, normalize ws→http', () => {\n    const env = getEnv({ LOADTEST_ALLOWLIST: 'ws://test-01.mayogu.test, http://test-02.mayogu.test/' });\n    expect(env.allowlist).toEqual(['http://test-01.mayogu.test', 'http://test-02.mayogu.test']);\n  });\n});\n\ndescribe('config — validateRunRequest (SD-1 + giới hạn an toàn)', () => {\n  it('chặn cứng gateway ngoài allowlist', () => {\n    const env = getEnv({ LOADTEST_ALLOWLIST: 'http://localhost:3000' });\n    const v = validateRunRequest(baseReq({ gatewayUrl: 'http://production.example.com' }), env);\n    expect(v.ok).toBe(false);\n    expect(v.errors.join(' ')).toContain('allowlist');\n  });\n\n  it('chấp nhận gateway trong allowlist', () => {\n    const env = getEnv({ LOADTEST_ALLOWLIST: 'http://localhost:3000' });\n    expect(validateRunRequest(baseReq(), env).ok).toBe(true);\n  });\n\n  it('chặn target > maxTarget (preset 1M/10M)', () => {\n    const env = getEnv({ LOADTEST_MAX_TARGET: '200000' });\n    const v = validateRunRequest(baseReq({ targetUsers: 1_000_000 }), env);\n    expect(v.ok).toBe(false);\n    expect(v.errors.join(' ')).toContain('vượt giới hạn an toàn');\n  });\n\n  it('chặn duration > 60 phút (access token 1h)', () => {\n    const env = getEnv({ LOADTEST_MAX_DURATION_MIN: '60' });\n    const v = validateRunRequest(baseReq({ durationMin: 90 }), env);\n    expect(v.ok).toBe(false);\n  });\n\n  it('chặn profile tổng ≠ 100%', () => {\n    const env = getEnv({});\n    const v = validateRunRequest(baseReq({ profile: { chat: 40, read: 30, comment: 20, like: 5, view: 0 } }), env);\n    expect(v.ok).toBe(false);\n  });\n\n  it('cảnh báo khi ramp chat vượt trần matching', () => {\n    const env = getEnv({});\n    const v = validateRunRequest(baseReq({ targetUsers: 100_000, durationMin: 5, profile: { chat: 100, read: 0, comment: 0, like: 0, view: 0 } }), env);\n    expect(v.ok).toBe(true);\n    expect(v.warnings.some((w) => w.includes('Matching engine'))).toBe(true);\n  });\n});\n\ndescribe('config — buildRunConfig', () => {\n  it('resolve workerCount + durationSec + seed', () => {\n    const env = getEnv({ LOADTEST_WORKERS: '4' });\n    const cfg = buildRunConfig(baseReq(), env);\n    expect(cfg.workerCount).toBe(4);\n    expect(cfg.socketsPerWorker).toBe(2500);\n    expect(cfg.durationSec).toBe(1800);\n    expect(cfg.runId).toMatch(/^lt/);\n    expect(cfg.useExistingAccounts).toBe(true);\n  });\n\n  it('auto workerCount theo target', () => {\n    const env = getEnv({ LOADTEST_WORKERS: '0' });\n    expect(resolveWorkerCount(10_000, env)).toBeGreaterThanOrEqual(1);\n  });\n});\n\ndescribe('config — validateEnv (T-03 fail-fast)', () => {\n  it('production + thiếu key → errors (DB required, OTP, AUTH)', () => {\n    const env = getEnv({\n      LOADTEST_DB_REQUIRED: 'false',\n      LOADTEST_DATABASE_URL: PLACEHOLDER_DB_URL,\n      LOADTEST_OTP_SECRET: '',\n      LOADTEST_AUTH_SECRET: '',\n    });\n    const errs = validateEnv(env, { production: true }).filter((p) => p.severity === 'error');\n    expect(errs.some((p) => p.key === 'LOADTEST_DATABASE_URL')).toBe(true);\n    expect(errs.some((p) => p.key === 'LOADTEST_OTP_SECRET')).toBe(true);\n    expect(errs.some((p) => p.key === 'LOADTEST_AUTH_SECRET')).toBe(true);\n  });\n\n  it('dev + dbRequired=false + thiếu key → không error (chỉ warning)', () => {\n    const env = getEnv({\n      LOADTEST_DB_REQUIRED: 'false',\n      LOADTEST_DATABASE_URL: PLACEHOLDER_DB_URL,\n      LOADTEST_OTP_SECRET: '',\n      LOADTEST_AUTH_SECRET: '',\n    });\n    const problems = validateEnv(env, { production: false });\n    expect(problems.filter((p) => p.severity === 'error')).toHaveLength(0);\n  });\n\n  it('dbRequired=true (mặc định) + placeholder DB URL → error', () => {\n    const env = getEnv({ LOADTEST_DATABASE_URL: PLACEHOLDER_DB_URL });\n    const errs = validateEnv(env).filter((p) => p.severity === 'error');\n    expect(errs.some((p) => p.key === 'LOADTEST_DATABASE_URL')).toBe(true);\n  });\n\n  it('sai prefix DB URL → error', () => {\n    const env = getEnv({\n      LOADTEST_DB_REQUIRED: 'true',\n      LOADTEST_DATABASE_URL: 'mysql://foo:bar@localhost/db',\n    });\n    const errs = validateEnv(env).filter((p) => p.severity === 'error');\n    expect(errs.some((p) => p.key === 'LOADTEST_DATABASE_URL')).toBe(true);\n  });\n\n  it('dev DB URL với username appuser + password thật → PASS (không false-positive — T-03)', () => {\n    const env = getEnv({\n      LOADTEST_DB_REQUIRED: 'true',\n      LOADTEST_DATABASE_URL: 'postgresql://appuser:s3cret-pw-123@localhost:5439/loadtest',\n    });\n    const errs = validateEnv(env).filter((p) => p.severity === 'error');\n    expect(errs.some((p) => p.key === 'LOADTEST_DATABASE_URL')).toBe(false);\n  });\n\n  it('default credential cũ (appuser:secret) → error (T-03)', () => {\n    const env = getEnv({\n      LOADTEST_DB_REQUIRED: 'true',\n      LOADTEST_DATABASE_URL: DEFAULT_DEV_DB_URL,\n    });\n    const errs = validateEnv(env).filter((p) => p.severity === 'error');\n    expect(errs.some((p) => p.key === 'LOADTEST_DATABASE_URL')).toBe(true);\n  });\n\n  it('REDIS_URL sai prefix → error', () => {\n    const env = getEnv({\n      LOADTEST_DB_REQUIRED: 'false',\n      LOADTEST_DATABASE_URL: 'postgresql://user:pass@localhost:5432/db',\n      LOADTEST_REDIS_URL: 'http://localhost:6379',\n    });\n    const errs = validateEnv(env, { production: false }).filter((p) => p.severity === 'error');\n    expect(errs.some((p) => p.key === 'LOADTEST_REDIS_URL')).toBe(true);\n  });\n\n  it('OTP/AUTH quá ngắn (<"+" 32) → error', () => {\n    const env = getEnv({\n      LOADTEST_DB_REQUIRED: 'false',\n      LOADTEST_DATABASE_URL: 'postgresql://user:pass@localhost:5432/db',\n      LOADTEST_OTP_SECRET: 'short',\n      LOADTEST_AUTH_SECRET: 'short',\n    });\n    const errs = validateEnv(env, { production: false }).filter((p) => p.severity === 'error');\n    expect(errs.some((p) => p.key === 'LOADTEST_OTP_SECRET')).toBe(true);\n    expect(errs.some((p) => p.key === 'LOADTEST_AUTH_SECRET')).toBe(true);\n  });\n\n  it('message validateEnv CHÍNH XÁC (diệt string mutant)', () => {\n    const env = getEnv({\n      LOADTEST_DB_REQUIRED: 'false',\n      LOADTEST_DATABASE_URL: 'mysql://foo:bar@localhost/db',\n      LOADTEST_OTP_SECRET: 'short',\n      LOADTEST_AUTH_SECRET: 'short',\n      LOADTEST_REDIS_URL: 'http://localhost:6379',\n    });\n    const problems = validateEnv(env, { production: false });\n    expect(problems.find((p) => p.key === 'LOADTEST_DATABASE_URL')?.message).toBe(\n      'phải bắt đầu bằng postgres:// hoặc postgresql:// (hiện: mysql://foo:***@localhost/db...)',\n    );\n    expect(problems.find((p) => p.key === 'LOADTEST_OTP_SECRET')?.message).toBe('phải ≥ 32 ký tự (hiện 5)');\n    expect(problems.find((p) => p.key === 'LOADTEST_AUTH_SECRET')?.message).toBe('phải ≥ 32 ký tự (hiện 5)');\n    expect(problems.find((p) => p.key === 'LOADTEST_REDIS_URL')?.message).toBe(\n      'phải bắt đầu bằng redis:// hoặc rediss:// (hiện: http://localhost:6379/...)',\n    );\n  });\n\n  it('OTP/AUTH đúng biên 32 ký tự → không error', () => {\n    const env = getEnv({\n      LOADTEST_DB_REQUIRED: 'false',\n      LOADTEST_DATABASE_URL: 'postgresql://user:pass@localhost:5432/db',\n      LOADTEST_OTP_SECRET: 'a'.repeat(32),\n      LOADTEST_AUTH_SECRET: 'b'.repeat(32),\n    });\n    const errs = validateEnv(env, { production: false }).filter((p) => p.severity === 'error');\n    expect(errs.some((p) => p.key === 'LOADTEST_OTP_SECRET')).toBe(false);\n    expect(errs.some((p) => p.key === 'LOADTEST_AUTH_SECRET')).toBe(false);\n  });\n\n  it('warning mặc định khi thiếu OTP/AUTH (dev) — message chính xác', () => {\n    const env = getEnv({\n      LOADTEST_DB_REQUIRED: 'false',\n      LOADTEST_DATABASE_URL: 'postgresql://user:pass@localhost:5432/db',\n      LOADTEST_OTP_SECRET: '',\n      LOADTEST_AUTH_SECRET: '',\n    });\n    const problems = validateEnv(env, { production: false });\n    expect(problems.find((p) => p.key === 'LOADTEST_OTP_SECRET')?.message).toBe(\n      'thiếu — register sẽ fail (cần set trong loadtest/.env)',\n    );\n    expect(problems.find((p) => p.key === 'LOADTEST_AUTH_SECRET')?.message).toBe(\n      'thiếu — sẽ dùng fallback tự sinh (dev-only)',\n    );\n  });\n\n  it('production flag: opts.production=false THẮNG NODE_ENV=production (?? không phải ||)', () => {\n    const env = getEnv({\n      LOADTEST_DB_REQUIRED: 'false',\n      LOADTEST_DATABASE_URL: PLACEHOLDER_DB_URL,\n      LOADTEST_OTP_SECRET: '',\n      LOADTEST_AUTH_SECRET: '',\n    });\n    const prev = process.env.NODE_ENV;\n    try {\n      process.env.NODE_ENV = 'production';\n      // ?? : opts.production=false (không nullish) → dùng false → KHÔNG production error\n      const problems = validateEnv(env, { production: false });\n      expect(problems.filter((p) => p.severity === 'error')).toHaveLength(0);\n      // không opts → dùng NODE_ENV → production error xuất hiện\n      const prodProblems = validateEnv(env);\n      expect(prodProblems.filter((p) => p.severity === 'error').length).toBeGreaterThan(0);\n    } finally {\n      if (prev === undefined) delete process.env.NODE_ENV;\n      else process.env.NODE_ENV = prev;\n    }\n  });\n});\n\ndescribe('config — newRunId (S-9/B-4 collision fix)', () => {\n  it('2 lần gọi liên tiếp → id khác nhau', () => {\n    expect(newRunId()).not.toBe(newRunId());\n  });\n\n  it('sau \"restart\" (module reload, runSeq reset) → id khác id cũ', async () => {\n    const first = newRunId();\n    vi.resetModules();\n    const mod = await import('../config');\n    const second = mod.newRunId();\n    expect(second).not.toBe(first);\n    expect(second).toMatch(/^lt[a-z0-9]{2,24}$/i);\n  });\n});\n\ndescribe('util — normalizeUrl', () => {\n  it('ws→http + bỏ trailing slash', () => {\n    expect(normalizeUrl('ws://localhost:3000/')).toBe('http://localhost:3000');\n    expect(normalizeUrl('https://x.com')).toBe('https://x.com');\n  });\n});\n\ndescribe('util — redactUrl (T-03: không lộ password trong log/error)', () => {\n  it('mask password trong DB URL có user:pass', () => {\n    expect(redactUrl('postgresql://appuser:s3cret-pw@localhost:5439/loadtest')).toBe(\n      'postgresql://appuser:***@localhost:5439/loadtest',\n    );\n  });\n  it('URL không password → giữ nguyên', () => {\n    expect(redactUrl('redis://localhost:6379')).toBe('redis://localhost:6379');\n  });\n  it('placeholder URL (port không phải số — URL không parse) → fallback regex vẫn mask', () => {\n    expect(redactUrl(PLACEHOLDER_DB_URL)).toBe('postgresql://USER:***@HOST:PORT/DB');\n  });\n});\n\ndescribe('config — env precedence (T-03: process.env > .env file > defaults)', () => {\n  it('process.env thắng .env file', () => {\n    const merged = mergeEnvSources(\n      { LOADTEST_PORT: '7000' },\n      { LOADTEST_PORT: '3401', LOADTEST_MAX_TARGET: '50000' },\n      {},\n    );\n    expect(merged.LOADTEST_PORT).toBe('7000'); // shell env override được .env\n    expect(merged.LOADTEST_MAX_TARGET).toBe('50000'); // .env file cung cấp giá trị\n  });\n  it('overrides (getEnv arg) thắng process.env', () => {\n    const merged = mergeEnvSources({ LOADTEST_PORT: '7000' }, { LOADTEST_PORT: '3401' }, { LOADTEST_PORT: '8000' });\n    expect(merged.LOADTEST_PORT).toBe('8000');\n  });\n});\n\n// ─── T-11 (G-2): test mở rộng diệt mutant config.ts ────────────────────────\n\ndescribe('config — loadDotEnv (T-11)', () => {\n  it('parse .env đúng: comment, quotes, khoảng trắng, line invalid', () => {\n    const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'lt-dotenv-'));\n    fs.writeFileSync(\n      path.join(dir, '.env'),\n      [\n        '# comment',\n        'KEY_A=value-a',\n        'KEY_B=\"quoted value\"',\n        \"KEY_C='single quoted'\",\n        '  KEY_D=  padded  ',\n        'KEY_E=', // value rỗng\n        'NO_EQUALS_LINE',\n        '=orphan-key',\n        '',\n      ].join('\\n'),\n      'utf8',\n    );\n    const parsed = loadDotEnv(dir);\n    expect(parsed.KEY_A).toBe('value-a');\n    expect(parsed.KEY_B).toBe('quoted value');\n    expect(parsed.KEY_C).toBe('single quoted');\n    expect(parsed.KEY_D).toBe('padded');\n    expect(parsed.KEY_E).toBe('');\n    expect(parsed.NO_EQUALS_LINE).toBeUndefined();\n  });\n\n  it('quote LỆCH (chỉ mở không đóng / ngược) → KHÔNG strip', () => {\n    const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'lt-dotenv-odd-'));\n    fs.writeFileSync(\n      path.join(dir, '.env'),\n      ['A=\"open-only', 'B=close-only\"', \"C='mixed\\\"\", 'D=\"double-single\\'', 'E=\"'].join('\\n'),\n      'utf8',\n    );\n    const parsed = loadDotEnv(dir);\n    expect(parsed.A).toBe('\"open-only'); // chỉ startsWith(\") → giữ nguyên\n    expect(parsed.B).toBe('close-only\"'); // chỉ endsWith(\") → giữ nguyên\n    expect(parsed.C).toBe(\"'mixed\\\"\"); // quote trái loại → giữ nguyên\n    expect(parsed.D).toBe('\"double-single\\''); // mở \" đóng ' → giữ nguyên\n    expect(parsed.E).toBe(''); // \" đơn → slice(1,-1) → rỗng\n  });\n\n  it('file không tồn tại → {}', () => {\n    const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'lt-dotenv-missing-'));\n    expect(loadDotEnv(dir)).toEqual({});\n  });\n});\n\ndescribe('config — getEnv defaults đầy đủ (T-11)', () => {\n  it('mọi key mặc định đúng (không override)', () => {\n    const env = getEnv({\n      LOADTEST_DB_REQUIRED: 'false',\n      LOADTEST_DATABASE_URL: 'postgresql://user:pass@localhost:5432/db',\n    });\n    expect(env.port).toBe(3401);\n    expect(env.host).toBe('127.0.0.1');\n    expect(env.gatewayUrl).toBe('http://localhost:3000');\n    expect(env.maxTarget).toBe(200_000);\n    expect(env.maxDurationMin).toBe(60);\n    expect(env.maxRegisterRamp).toBe(100);\n    expect(env.workerCount).toBe(0);\n    expect(env.maxSocketsPerWorker).toBe(10_000);\n    expect(env.maxPendingOutbox).toBe(1000);\n    expect(env.scrapeIntervalMs).toBe(5000);\n    expect(env.registerRamp).toBe(100);\n    expect(env.fixturePostIds).toEqual([]);\n    expect(env.dbRequired).toBe(false);\n    expect(env.corsOrigins).toEqual(['http://localhost:5173']);\n    expect(env.allowRegister).toBe(false);\n    expect(env.rateLimitDisabled).toBe(false);\n    expect(env.rateLimitLoginFails).toBe(5);\n    expect(env.rateLimitWindowMs).toBe(60_000);\n    expect(env.rateLimitStartMs).toBe(10_000);\n    expect(env.rateLimitWriteBucket).toBe(0);\n    expect(env.trustProxy).toBe(false);\n    expect(env.shutdownTimeoutMs).toBe(10_000);\n    expect(env.dataDir).toBe('./loadtest/data');\n  });\n\n  it('parse từng key override: fixture post ids, booleans, rate-limit, workers', () => {\n    const env = getEnv({\n      LOADTEST_FIXTURE_POST_IDS: ' post-1, post-2 ,,post-3 ',\n      LOADTEST_ALLOW_REGISTER: 'true',\n      LOADTEST_RATE_LIMIT_DISABLED: 'true',\n      LOADTEST_RATE_LIMIT_LOGIN_FAILS: '3',\n      LOADTEST_RATE_LIMIT_WINDOW_MS: '5000',\n      LOADTEST_RATE_LIMIT_START_MS: '2000',\n      LOADTEST_RATE_LIMIT_WRITE_BUCKET: '10',\n      LOADTEST_TRUST_PROXY: 'true',\n      LOADTEST_SHUTDOWN_TIMEOUT_MS: '20000',\n      LOADTEST_WORKERS: '7',\n      LOADTEST_MAX_SOCKETS_PER_WORKER: '500',\n      LOADTEST_REGISTER_RAMP: '50',\n      LOADTEST_GATEWAY_URL: 'ws://gateway.mayogu.test/',\n      LOADTEST_CORS_ORIGIN: 'http://a.example, http://b.example',\n    });\n    expect(env.fixturePostIds).toEqual(['post-1', 'post-2', 'post-3']);\n    expect(env.allowRegister).toBe(true);\n    expect(env.rateLimitDisabled).toBe(true);\n    expect(env.rateLimitLoginFails).toBe(3);\n    expect(env.rateLimitWindowMs).toBe(5000);\n    expect(env.rateLimitStartMs).toBe(2000);\n    expect(env.rateLimitWriteBucket).toBe(10);\n    expect(env.trustProxy).toBe(true);\n    expect(env.shutdownTimeoutMs).toBe(20_000);\n    expect(env.workerCount).toBe(7);\n    expect(env.maxSocketsPerWorker).toBe(500);\n    expect(env.registerRamp).toBe(50);\n    expect(env.gatewayUrl).toBe('http://gateway.mayogu.test');\n    expect(env.corsOrigins).toEqual(['http://a.example', 'http://b.example']);\n  });\n\n  it('giá trị number hỏng → fallback default (không NaN)', () => {\n    const env = getEnv({ LOADTEST_PORT: 'not-a-number', LOADTEST_MAX_TARGET: 'abc' });\n    expect(env.port).toBe(3401);\n    expect(env.maxTarget).toBe(200_000);\n  });\n\n  it('giá trị number rỗng \"\" → fallback default; \"0\" → 0 (không fallback)', () => {\n    const env = getEnv({ LOADTEST_PORT: '', LOADTEST_MAX_TARGET: '0' });\n    expect(env.port).toBe(3401); // '' → default\n    expect(env.maxTarget).toBe(0); // '0' → 0 hợp lệ\n  });\n\n  it('LOADTEST_DEBUG \"true\"/\"false\" → env.debug tương ứng', () => {\n    expect(getEnv({ LOADTEST_DEBUG: 'true' }).debug).toBe(true);\n    expect(getEnv({ LOADTEST_DEBUG: 'false' }).debug).toBe(false);\n  });\n\n  it('LOADTEST_GATEWAY_URL rỗng → default localhost:3000', () => {\n    const env = getEnv({ LOADTEST_GATEWAY_URL: '' });\n    expect(env.gatewayUrl).toBe('http://localhost:3000');\n  });\n\n  it('dbRequired mặc định true (Q-2); set false → false', () => {\n    expect(getEnv({ LOADTEST_DATABASE_URL: 'postgresql://u:p@localhost:5432/db' }).dbRequired).toBe(true);\n    expect(getEnv({ LOADTEST_DB_REQUIRED: 'false' }).dbRequired).toBe(false);\n  });\n});\n\ndescribe('config — validateRunRequest message CHÍNH XÁC (T-11 — diệt string mutant)', () => {\n  const env = getEnv({ LOADTEST_ALLOWLIST: 'http://localhost:3000', LOADTEST_MAX_DURATION_MIN: '60' });\n\n  it('thiếu gatewayUrl → \"gatewayUrl bắt buộc\"', () => {\n    const v = validateRunRequest({ ...baseReq(), gatewayUrl: '' }, env);\n    expect(v.errors).toContain('gatewayUrl bắt buộc');\n  });\n\n  it('targetUsers <"+" 1000 → \"targetUsers phải ≥ 1000\"', () => {\n    expect(validateRunRequest(baseReq({ targetUsers: 999 }), env).errors).toEqual(['targetUsers phải ≥ 1000']);\n    expect(validateRunRequest(baseReq({ targetUsers: 1000.5 }), env).errors).toEqual(['targetUsers phải ≥ 1000']);\n  });\n\n  it('targetUsers > maxTarget → message chính xác có \"vượt giới hạn an toàn\" + maxTarget', () => {\n    const v = validateRunRequest(baseReq({ targetUsers: 500_000 }), env);\n    expect(v.errors[0]).toBe(\n      'targetUsers 500000 vượt giới hạn an toàn 200000 (preset 1M/10M cần cluster — v1.1). Override bằng LOADTEST_MAX_TARGET nếu thực sự có hạ tầng.',\n    );\n  });\n\n  it('durationMin NaN/0/âm → \"durationMin phải > 0\"; quá max → message chính xác', () => {\n    expect(validateRunRequest(baseReq({ durationMin: 0 }), env).errors).toContain('durationMin phải > 0');\n    expect(validateRunRequest(baseReq({ durationMin: Number.NaN }), env).errors).toContain('durationMin phải > 0');\n    const v = validateRunRequest(baseReq({ durationMin: 90 }), env);\n    expect(v.errors[0]).toBe('durationMin 90 phút vượt tối đa 60 phút (access token TTL 1h — PRD §5.3).');\n  });\n\n  it('rampRate 0/âm → \"rampRate phải > 0\"; > 2000 → warning chính xác', () => {\n    expect(validateRunRequest(baseReq({ rampRate: 0 }), env).errors).toContain('rampRate phải > 0');\n    expect(validateRunRequest(baseReq({ rampRate: -5 }), env).errors).toContain('rampRate phải > 0');\n    const v = validateRunRequest(baseReq({ rampRate: 5000 }), env);\n    expect(v.warnings[0]).toBe('rampRate > 2000/s có thể bão hòa event loop tool và matching engine (~100 user/s chat).');\n  });\n\n  it('rampRate đúng biên 2000 → KHÔNG warning (điều kiện > 2000, không >=)', () => {\n    const env2000 = getEnv({ LOADTEST_ALLOWLIST: 'http://localhost:3000' });\n    expect(validateRunRequest(baseReq({ rampRate: 2000 }), env2000).warnings).toHaveLength(0);\n    expect(validateRunRequest(baseReq({ rampRate: 2001 }), env2000).warnings.length).toBeGreaterThan(0);\n  });\n\n  it('thiếu profile → \"profile bắt buộc\"; tổng ≠ 100 → message chính xác', () => {\n    const noProfile = { ...baseReq() } as StartRunRequest;\n    delete (noProfile as { profile?: unknown }).profile;\n    expect(validateRunRequest(noProfile, env).errors).toContain('profile bắt buộc');\n    const v = validateRunRequest(baseReq({ profile: { chat: 40, read: 30, comment: 20, like: 5, view: 0 } }), env);\n    expect(v.errors[0]).toBe('Tổng profile = 95% — phải đúng 100%');\n  });\n\n  it('profile field NaN/âm → \"profile.{k} không hợp lệ\"', () => {\n    const v = validateRunRequest(baseReq({ profile: { chat: Number.NaN, read: 30, comment: 20, like: 10, view: 0 } }), env);\n    expect(v.errors).toContain('profile.chat không hợp lệ');\n    const neg = validateRunRequest(baseReq({ profile: { chat: 40, read: -1, comment: 20, like: 10, view: 0 } }), env);\n    expect(neg.errors).toContain('profile.read không hợp lệ');\n  });\n\n  it('gateway ws:// được normalize rồi mới so allowlist', () => {\n    const v = validateRunRequest(baseReq({ gatewayUrl: 'ws://localhost:3000' }), env);\n    expect(v.ok).toBe(true);\n  });\n\n  it('cảnh báo matching seat: chat=0 → KHÔNG warning; target đúng biên 10_000 → KHÔNG warning; seat == duration → KHÔNG warning', () => {\n    const e = getEnv({ LOADTEST_ALLOWLIST: 'http://localhost:3000' });\n    const chat0 = validateRunRequest(baseReq({ targetUsers: 100_000, profile: { chat: 0, read: 50, comment: 30, like: 20, view: 0 } }), e);\n    expect(chat0.warnings.some((w) => w.includes('Matching engine'))).toBe(false);\n    const at10k = validateRunRequest(baseReq({ targetUsers: 10_000, profile: { chat: 100, read: 0, comment: 0, like: 0, view: 0 } }), e);\n    expect(at10k.warnings.some((w) => w.includes('Matching engine'))).toBe(false);\n    const seatEq = validateRunRequest(\n      baseReq({ targetUsers: 60_000, durationMin: 10, profile: { chat: 100, read: 0, comment: 0, like: 0, view: 0 } }),\n      e,\n    );\n    expect(seatEq.warnings.some((w) => w.includes('Matching engine'))).toBe(false); // seat 600s == duration 600s\n    const over = validateRunRequest(\n      baseReq({ targetUsers: 60_000, durationMin: 9, profile: { chat: 100, read: 0, comment: 0, like: 0, view: 0 } }),\n      e,\n    );\n    expect(over.warnings.some((w) => w.includes('Matching engine'))).toBe(true); // seat 600s > 540s\n  });\n});\n\ndescribe('config — buildRunConfig nhánh (T-11)', () => {\n  it('freshAccounts=true → useExistingAccounts=false; ngược lại true', () => {\n    const env = getEnv({ LOADTEST_WORKERS: '2' });\n    const fresh = buildRunConfig(baseReq({ freshAccounts: true }), env);\n    expect(fresh.useExistingAccounts).toBe(false);\n    expect(fresh.freshAccounts).toBe(true);\n    const reuse = buildRunConfig(baseReq(), env);\n    expect(reuse.useExistingAccounts).toBe(true);\n  });\n\n  it('registerRamp bị clamp theo maxRegisterRamp', () => {\n    const env = getEnv({ LOADTEST_REGISTER_RAMP: '9999' });\n    const cfg = buildRunConfig(baseReq(), env);\n    expect(cfg.registerRamp).toBe(env.maxRegisterRamp);\n  });\n\n  it('profile merge với DEFAULT_PROFILE (field thiếu → default)', () => {\n    const env = getEnv({});\n    const cfg = buildRunConfig(baseReq({ profile: { chat: 100, read: 0, comment: 0, like: 0, view: 0 } }), env);\n    expect(cfg.profile).toEqual({ chat: 100, read: 0, comment: 0, like: 0, view: 0 });\n  });\n\n  it('seed + createdAt là số', () => {\n    const env = getEnv({});\n    const cfg = buildRunConfig(baseReq(), env);\n    expect(Number.isFinite(cfg.seed)).toBe(true);\n    expect(Number.isFinite(cfg.createdAt)).toBe(true);\n  });\n});\n\ndescribe('config — resolveWorkerCount / estimateInfra (T-11)', () => {\n  it('workerCount cấu hình thắng auto', () => {\n    const env = getEnv({ LOADTEST_WORKERS: '3' });\n    expect(resolveWorkerCount(100_000, env)).toBe(3);\n  });\n\n  it('auto: clamp theo target/socketsPerWorker và 32', () => {\n    const env = getEnv({ LOADTEST_WORKERS: '0', LOADTEST_MAX_SOCKETS_PER_WORKER: '100' });\n    const w = resolveWorkerCount(100_000, env);\n    expect(w).toBeGreaterThanOrEqual(1);\n    expect(w).toBeLessThanOrEqual(32);\n  });\n\n  it('auto: giá trị CHÍNH XÁC với availableParallelism mock (diệt mutant min/max/||)', () => {\n    const env = getEnv({ LOADTEST_WORKERS: '0', LOADTEST_MAX_SOCKETS_PER_WORKER: '100' });\n    const fn = vi.mocked(os.availableParallelism);\n    fn.mockReturnValue(100);\n    // cpus-1 = 99 → min(99, byTarget=1000) = 99 → max(1, 99) → min(99, 32) = 32\n    expect(resolveWorkerCount(100_000, env)).toBe(32);\n    fn.mockReturnValue(8);\n    // cpus-1 = 7 → min(7, 1000) = 7 → max(1, 7) → min(7, 32) = 7\n    expect(resolveWorkerCount(100_000, env)).toBe(7);\n    fn.mockReturnValue(1);\n    // cpus-1 = 0 → || 1 → 1 → min(1, 1000) = 1 → max(1, 1) → 1\n    expect(resolveWorkerCount(100_000, env)).toBe(1);\n  });\n\n  it('estimateInfra: workers/ramGB/seatMin', () => {\n    const env = getEnv({});\n    const e = estimateInfra(50_000, env);\n    expect(e.workers).toBe(5);\n    expect(e.ramGB).toBeGreaterThan(2);\n    expect(e.seatMin).toBe(9); // 50000/100/60 → ceil(8.33)\n  });\n});\n\ndescribe('config — settings file allowlist (SD-1, T-11)', () => {\n  it('saveSettings → loadSettings roundtrip', () => {\n    const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'lt-settings-'));\n    const env = getEnv({ LOADTEST_DATA_DIR: dir });\n    saveSettings(env, { allowlist: ['http://extra.example'], updatedAt: 123 });\n    const loaded = loadSettings(env);\n    expect(loaded.allowlist).toEqual(['http://extra.example']);\n    expect(loaded.updatedAt).toBe(123);\n  });\n\n  it('file hỏng (không phải JSON) → default { allowlist: [], updatedAt: 0 }', () => {\n    const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'lt-settings-bad-'));\n    fs.writeFileSync(path.join(dir, 'settings.json'), '{not json', 'utf8');\n    const env = getEnv({ LOADTEST_DATA_DIR: dir });\n    expect(loadSettings(env)).toEqual({ allowlist: [], updatedAt: 0 });\n  });\n\n  it('mergedAllowlist: env + settings, dedupe, normalize ws→http', () => {\n    const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'lt-settings-merge-'));\n    const env = getEnv({ LOADTEST_DATA_DIR: dir, LOADTEST_ALLOWLIST: 'http://localhost:3000, ws://extra.example' });\n    saveSettings(env, { allowlist: ['http://extra.example/', 'http://from-file.example'], updatedAt: 0 });\n    expect(mergedAllowlist(env)).toEqual(['http://localhost:3000', 'http://extra.example', 'http://from-file.example']);\n  });\n});\n\ndescribe('config — misc (T-11)', () => {\n  it('isKnownBadDbUrl: placeholder + default credential cũ → true; dev thật → false', () => {\n    expect(isKnownBadDbUrl(PLACEHOLDER_DB_URL)).toBe(true);\n    expect(isKnownBadDbUrl(DEFAULT_DEV_DB_URL)).toBe(true);\n    expect(isKnownBadDbUrl('postgresql://user:real@localhost:5432/db')).toBe(false);\n    expect(isKnownBadDbUrl('')).toBe(false);\n  });\n\n  it('PRESETS: 1M/10M requiresCluster, label đúng', () => {\n    expect(PRESETS.map((p) => p.id)).toEqual(['10k', '50k', '100k', '1M', '10M']);\n    expect(PRESETS.find((p) => p.id === '1M')?.requiresCluster).toBe(true);\n    expect(PRESETS.find((p) => p.id === '10M')?.requiresCluster).toBe(true);\n    expect(PRESETS.find((p) => p.id === '10k')?.targetUsers).toBe(10_000);\n    expect(DEFAULT_PROFILE).toEqual({ chat: 40, read: 30, comment: 20, like: 10, view: 0 });\n  });\n});\n"},"loadtest/__tests__/report.test.ts":{"tests":[{"id":"63","name":"buildReport per-action success rate dùng ok/fail thật theo action (AC6.1)"},{"id":"64","name":"buildReport summary throughput avg/peak + echo rate"},{"id":"65","name":"reportToMarkdown — NO_POST_FIXTURE (T-07/S-12) báo rõ section \"Không có post fixture\" khi feed trống"},{"id":"66","name":"reportToMarkdown — NO_POST_FIXTURE (T-07/S-12) không có NO_POST_FIXTURE → không thêm section"},{"id":"67","name":"detectBottlenecks (AC6.2) queue-count tăng liên tục > 5 phút → nghi ngờ matching trần 100/s"},{"id":"68","name":"detectBottlenecks (AC6.2) echo rate <"+" 95% → bottleneck chat"},{"id":"69","name":"detectBottlenecks (AC6.2) P95 tăng > 2× so với 5 phút đầu → bottleneck latency"},{"id":"70","name":"detectBottlenecks (AC6.2) worker CPU > 85% → cảnh báo tool-side"},{"id":"71","name":"detectBottlenecks (AC6.2) hệ thống khỏe → không có bottleneck"},{"id":"72","name":"detectBottlenecks (AC6.2) ít hơn 5 tick → không chạy detector"},{"id":"73","name":"detectBottlenecks (AC6.2) echoSent <"+" 100 → KHÔNG cảnh báo echo dù echoOk = 0 (ngưỡng sample)"},{"id":"74","name":"detectBottlenecks (AC6.2) echo rate 95% → KHÔNG bottleneck; 94.9% → có (biên)"},{"id":"75","name":"detectBottlenecks (AC6.2) echo bottleneck: level High khi <"+" 90%, Med khi 90-95%, evidence rate CHÍNH XÁC"},{"id":"76","name":"detectBottlenecks (AC6.2) queue bottleneck: growth biên 50 → KHÔNG; 51 → Med; 600s → High"},{"id":"77","name":"detectBottlenecks (AC6.2) worker CPU biên: 85 → KHÔNG; 85.1 → Med; history <"+" 30 tick → KHÔNG"},{"id":"78","name":"detectBottlenecks (AC6.2) P95: first5 đúng biên 30 tick → vẫn chạy detector (diệt > 30)"},{"id":"79","name":"buildReport — nhánh sâu (T-11) tickHistory rỗng → counters default, không crash, successRate 100"},{"id":"80","name":"buildReport — nhánh sâu (T-11) status stopped/error + stopReason passthrough"},{"id":"81","name":"buildReport — nhánh sâu (T-11) perAction sort theo count giảm dần"},{"id":"82","name":"buildReport — nhánh sâu (T-11) noPostFixtureSkipped suy từ history errors khi input không cung cấp"},{"id":"83","name":"buildReport — nhánh sâu (T-11) actionsTotal/success/fail truyền thẳng vào summary"},{"id":"84","name":"buildReport — nhánh sâu (T-11) successRate/echoRate CHÍNH XÁC 50/50 (diệt mutant làm tròn + bỏ /10)"},{"id":"85","name":"buildReport — nhánh sâu (T-11) perAction successRate CHÍNH XÁC 50 khi ok/fail cân bằng; 100 khi không có action"},{"id":"86","name":"reportToMarkdown — snapshot toàn bộ output (diệt string mutant) markdown đầy đủ ổn định (snapshot)"},{"id":"87","name":"reportToMarkdown — snapshot toàn bộ output (diệt string mutant) markdown với status error + stopReason + bottleneck + NO_POST_FIXTURE (snapshot)"},{"id":"88","name":"reportToMarkdown — snapshot toàn bộ output (diệt string mutant) formatMs: <"+" 1s → ms; ≥ 1s → s (2 chữ số thập phân)"},{"id":"89","name":"ticksToCsv — snapshot (T-11) CSV đầy đủ header + row ổn định (snapshot)"},{"id":"90","name":"saveReportFiles (RE-3, T-11) ghi JSON + MD + CSV vào dir/{runId}/, trả về dir"},{"id":"91","name":"saveReportFiles (RE-3, T-11) thư mục không ghi được (path là FILE) → trả về \"\" (không throw)"}],"source":"/**\n * Unit tests — Report (RE-1..RE-3): buildReport + bottleneck detector (AC6.2).\n */\nimport { describe, it, expect } from 'vitest';\nimport * as fs from 'node:fs';\nimport * as os from 'node:os';\nimport * as path from 'node:path';\nimport { buildReport, detectBottlenecks, reportToMarkdown, ticksToCsv, saveReportFiles } from '../report';\nimport { ActionHistograms, BucketedHistogram } from '../metrics';\nimport type { LoadTestTick, RunConfig } from '../types';\n\nfunction fakeConfig(over: Partial<"+"RunConfig> = {}): RunConfig {\n  return {\n    runId: 'lt-test1',\n    targetUsers: 10_000,\n    rampRate: 200,\n    rampMode: 'rate',\n    durationMin: 10,\n    durationSec: 600,\n    profile: { chat: 40, read: 30, comment: 20, like: 10, view: 0 },\n    gatewayUrl: 'http://localhost:3000',\n    workerCount: 4,\n    socketsPerWorker: 2500,\n    registerRamp: 100,\n    useExistingAccounts: false,\n    freshAccounts: false,\n    seed: 42,\n    createdAt: 1_700_000_000_000, // cố định — snapshot markdown phải deterministic\n    ...over,\n  };\n}\n\nfunction fakeTick(ts: number, over: Partial<"+"LoadTestTick['counters']> = {}, latencyP95 = 100): LoadTestTick {\n  const base: LoadTestTick = {\n    type: 'tick',\n    runId: 'lt-test1',\n    ts,\n    phase: 'steady',\n    elapsedSec: Math.round((ts - 1_700_000_000_000) / 1000),\n    counters: {\n      usersCreated: 10_000, usersConnected: 10_000, usersActive: 9_500,\n      usersQueued: 100, usersInRoom: 8_000, actionsTotal: 100_000,\n      successTotal: 99_000, failTotal: 1_000, echoOk: 950, echoSent: 1_000,\n      queueCount: 200, roomCount: 1_333, droppedOutbox: 0, reconnectCount: 5,\n      rateLimitedNoEcho: 50,\n    },\n    rates: { successRate: 99, echoRate: 95 },\n    actionsPerSec: { chat: 400, read: 300 },\n    latency: { p50: 40, p95: latencyP95, p99: 300 },\n    errors: [{ code: 'HTTP_429', count: 10 }],\n    server: { wsConnections: 10_000, wsMessagesEmitted: 1_000_000, wsMessagesPerSec: 5_000 },\n    workers: { alive: 4, total: 4, cpuAvg: 50 },\n  };\n  return { ...base, counters: { ...base.counters, ...over } };\n}\n\ndescribe('buildReport', () => {\n  it('per-action success rate dùng ok/fail thật theo action (AC6.1)', () => {\n    const hist = new ActionHistograms();\n    const h = new BucketedHistogram();\n    for (let i = 0; i <"+" 100; i++) h.add(120);\n    hist.mergeFrom('chat', h.buckets);\n    const history = [fakeTick(1_700_000_000_000), fakeTick(1_700_000_001_000)];\n    const report = buildReport({\n      runId: 'lt-test1',\n      status: 'finished',\n      startAt: 1_700_000_000_000,\n      endAt: 1_700_000_001_000,\n      config: fakeConfig(),\n      tickHistory: history,\n      perActionHistograms: hist,\n      actionOk: { chat: 90 },\n      actionFail: { chat: 10 },\n      maxConnected: 10_000,\n      maxActive: 9_500,\n      maxQueue: 300,\n      peakActionsPerSec: 900,\n      provisioned: 10_000,\n    });\n    const chat = report.perAction.find((a) => a.action === 'chat');\n    expect(chat?.success).toBe(90);\n    expect(chat?.fail).toBe(10);\n    expect(chat?.successRate).toBeCloseTo(90, 1);\n    // count khớp histogram (không phóng đại — AC6.4)\n    expect(chat?.count).toBe(100);\n  });\n\n  it('summary throughput avg/peak + echo rate', () => {\n    const history = [fakeTick(1_700_000_000_000), fakeTick(1_700_000_001_000)];\n    const report = buildReport({\n      runId: 'lt-test1',\n      status: 'finished',\n      startAt: 1_700_000_000_000,\n      endAt: 1_700_000_002_000,\n      config: fakeConfig(),\n      tickHistory: history,\n      perActionHistograms: new ActionHistograms(),\n      actionOk: {},\n      actionFail: {},\n      maxConnected: 10_000,\n      maxActive: 9_500,\n      maxQueue: 300,\n      peakActionsPerSec: 900,\n      provisioned: 10_000,\n    });\n    expect(report.summary.throughputPeak).toBe(900);\n    expect(report.summary.echoRate).toBe(95);\n    expect(report.summary.successRate).toBe(99);\n  });\n});\n\ndescribe('reportToMarkdown — NO_POST_FIXTURE (T-07/S-12)', () => {\n  it('báo rõ section \"Không có post fixture\" khi feed trống', () => {\n    const tick: LoadTestTick = {\n      ...fakeTick(1_700_000_000_000),\n      errors: [{ code: 'NO_POST_FIXTURE', count: 123 }],\n    };\n    const report = buildReport({\n      runId: 'lt-test1',\n      status: 'finished',\n      startAt: 1_700_000_000_000,\n      endAt: 1_700_000_001_000,\n      config: fakeConfig(),\n      tickHistory: [tick],\n      perActionHistograms: new ActionHistograms(),\n      actionOk: {},\n      actionFail: {},\n      maxConnected: 10_000,\n      maxActive: 9_500,\n      maxQueue: 300,\n      peakActionsPerSec: 900,\n      provisioned: 10_000,\n    });\n    expect(report.noPostFixtureSkipped).toBe(123);\n    const md = reportToMarkdown(report);\n    expect(md).toContain('Không có post fixture — bỏ qua bước đọc feed');\n    expect(md).toContain('NO_POST_FIXTURE');\n  });\n\n  it('không có NO_POST_FIXTURE → không thêm section', () => {\n    const report = buildReport({\n      runId: 'lt-test1',\n      status: 'finished',\n      startAt: 1_700_000_000_000,\n      endAt: 1_700_000_001_000,\n      config: fakeConfig(),\n      tickHistory: [fakeTick(1_700_000_000_000)],\n      perActionHistograms: new ActionHistograms(),\n      actionOk: {},\n      actionFail: {},\n      maxConnected: 10_000,\n      maxActive: 9_500,\n      maxQueue: 300,\n      peakActionsPerSec: 900,\n      provisioned: 10_000,\n    });\n    expect(report.noPostFixtureSkipped).toBe(0);\n    expect(reportToMarkdown(report)).not.toContain('Không có post fixture');\n  });\n});\n\ndescribe('detectBottlenecks (AC6.2)', () => {\n  const base = (ts: number, over: Partial<"+"LoadTestTick['counters']> = {}, p95 = 100): LoadTestTick =>\n    fakeTick(ts, over, p95);\n\n  it('queue-count tăng liên tục > 5 phút → nghi ngờ matching trần 100/s', () => {\n    // 360 ticks, mỗi giây queue tăng 10\n    const history: LoadTestTick[] = [];\n    for (let i = 0; i <"+" 360; i++) {\n      history.push(base(1_700_000_000_000 + i * 1000, { queueCount: 100 + i * 10 }));\n    }\n    const out = detectBottlenecks({ history, echoOk: 950, echoSent: 1000, config: fakeConfig(), workerCpu: 30 });\n    const queueB = out.find((b) => b.title.includes('Queue-count'));\n    expect(queueB).toBeDefined();\n    expect(queueB?.evidence.length).toBeGreaterThan(0);\n  });\n\n  it('echo rate <"+" 95% → bottleneck chat', () => {\n    const history: LoadTestTick[] = [];\n    for (let i = 0; i <"+" 10; i++) history.push(base(1_700_000_000_000 + i * 1000));\n    const out = detectBottlenecks({ history, echoOk: 800, echoSent: 1000, config: fakeConfig(), workerCpu: 30 });\n    expect(out.some((b) => b.title.includes('echo rate'))).toBe(true);\n  });\n\n  it('P95 tăng > 2× so với 5 phút đầu → bottleneck latency', () => {\n    const history: LoadTestTick[] = [];\n    // 5 phút đầu khỏe ~100ms, sau đó thoái hóa 400ms — tổng 10 phút\n    for (let i = 0; i <"+" 300; i++) history.push(base(1_700_000_000_000 + i * 1000, {}, 100));\n    for (let i = 300; i <"+" 600; i++) history.push(base(1_700_000_000_000 + i * 1000, {}, 400));\n    const out = detectBottlenecks({ history, echoOk: 950, echoSent: 1000, config: fakeConfig(), workerCpu: 30 });\n    expect(out.some((b) => b.title.includes('P95 tăng'))).toBe(true);\n  });\n\n  it('worker CPU > 85% → cảnh báo tool-side', () => {\n    const history: LoadTestTick[] = [];\n    for (let i = 0; i <"+" 40; i++) history.push(base(1_700_000_000_000 + i * 1000));\n    const out = detectBottlenecks({ history, echoOk: 950, echoSent: 1000, config: fakeConfig(), workerCpu: 92 });\n    expect(out.some((b) => b.title.includes('Worker CPU'))).toBe(true);\n  });\n\n  it('hệ thống khỏe → không có bottleneck', () => {\n    const history: LoadTestTick[] = [];\n    for (let i = 0; i <"+" 40; i++) {\n      history.push(base(1_700_000_000_000 + i * 1000, { queueCount: 50 }, 60));\n    }\n    const out = detectBottlenecks({ history, echoOk: 990, echoSent: 1000, config: fakeConfig(), workerCpu: 40 });\n    expect(out.length).toBe(0);\n  });\n\n  it('ít hơn 5 tick → không chạy detector', () => {\n    const out = detectBottlenecks({ history: [base(1)], echoOk: 0, echoSent: 0, config: fakeConfig(), workerCpu: 0 });\n    expect(out.length).toBe(0);\n  });\n\n  it('echoSent <"+" 100 → KHÔNG cảnh báo echo dù echoOk = 0 (ngưỡng sample)', () => {\n    const history: LoadTestTick[] = [];\n    for (let i = 0; i <"+" 10; i++) history.push(base(1_700_000_000_000 + i * 1000));\n    const out = detectBottlenecks({ history, echoOk: 0, echoSent: 99, config: fakeConfig(), workerCpu: 30 });\n    expect(out.some((b) => b.title.includes('echo rate'))).toBe(false);\n  });\n\n  it('echo rate 95% → KHÔNG bottleneck; 94.9% → có (biên)', () => {\n    const history: LoadTestTick[] = [];\n    for (let i = 0; i <"+" 10; i++) history.push(base(1_700_000_000_000 + i * 1000));\n    const ok = detectBottlenecks({ history, echoOk: 95, echoSent: 100, config: fakeConfig(), workerCpu: 30 });\n    expect(ok.some((b) => b.title.includes('echo rate'))).toBe(false);\n    const bad = detectBottlenecks({ history, echoOk: 94.9, echoSent: 100, config: fakeConfig(), workerCpu: 30 });\n    expect(bad.some((b) => b.title.includes('echo rate'))).toBe(true);\n  });\n\n  it('echo bottleneck: level High khi <"+" 90%, Med khi 90-95%, evidence rate CHÍNH XÁC', () => {\n    const history: LoadTestTick[] = [];\n    for (let i = 0; i <"+" 10; i++) history.push(base(1_700_000_000_000 + i * 1000, { echoOk: 800, echoSent: 1000 }));\n    const high = detectBottlenecks({ history, echoOk: 800, echoSent: 1000, config: fakeConfig(), workerCpu: 30 });\n    const bHigh = high.find((b) => b.title.includes('echo rate'));\n    expect(bHigh?.level).toBe('High');\n    expect(bHigh?.evidence.length).toBe(10); // slice(-120) giữ 10 tick\n    expect(bHigh?.evidence[0].value).toBe(80); // (800/1000)*100 — diệt mutant *1000, /100, *\n    const medHistory: LoadTestTick[] = [];\n    for (let i = 0; i <"+" 10; i++) medHistory.push(base(1_700_000_000_000 + i * 1000, { echoOk: 940, echoSent: 1000 }));\n    const med = detectBottlenecks({ history: medHistory, echoOk: 940, echoSent: 1000, config: fakeConfig(), workerCpu: 30 });\n    expect(med.find((b) => b.title.includes('echo rate'))?.level).toBe('Med'); // 94% → Med (diệt >= 90)\n  });\n\n  it('queue bottleneck: growth biên 50 → KHÔNG; 51 → Med; 600s → High', () => {\n    const mk = (n: number, baseVal: number, plateau: number, splitAt: number): LoadTestTick[] => {\n      const out: LoadTestTick[] = [];\n      for (let i = 0; i <"+" n; i++) {\n        out.push(base(1_700_000_000_000 + i * 1000, { queueCount: i <"+" splitAt ? baseVal : plateau }));\n      }\n      return out;\n    };\n    // growth CHÍNH XÁC 50 (base 10 → 60): longest run 300s, growth 50 → KHÔNG bottleneck\n    const at50 = detectBottlenecks({ history: mk(300, 10, 60, 50), echoOk: 990, echoSent: 1000, config: fakeConfig(), workerCpu: 30 });\n    expect(at50.some((b) => b.title.includes('Queue-count'))).toBe(false);\n    // growth 51 (base 10 → 61): 300s → Med\n    const at51 = detectBottlenecks({ history: mk(300, 10, 61, 50), echoOk: 990, echoSent: 1000, config: fakeConfig(), workerCpu: 30 });\n    const b51 = at51.find((b) => b.title.includes('Queue-count'));\n    expect(b51?.level).toBe('Med');\n    // 600s → High (biên >= 600)\n    const at600 = detectBottlenecks({ history: mk(600, 10, 61, 100), echoOk: 990, echoSent: 1000, config: fakeConfig(), workerCpu: 30 });\n    expect(at600.find((b) => b.title.includes('Queue-count'))?.level).toBe('High');\n  });\n\n  it('worker CPU biên: 85 → KHÔNG; 85.1 → Med; history <"+" 30 tick → KHÔNG', () => {\n    const history: LoadTestTick[] = [];\n    for (let i = 0; i <"+" 40; i++) history.push(base(1_700_000_000_000 + i * 1000));\n    const at85 = detectBottlenecks({ history, echoOk: 990, echoSent: 1000, config: fakeConfig(), workerCpu: 85 });\n    expect(at85.some((b) => b.title.includes('Worker CPU'))).toBe(false);\n    const over85 = detectBottlenecks({ history, echoOk: 990, echoSent: 1000, config: fakeConfig(), workerCpu: 85.1 });\n    expect(over85.find((b) => b.title.includes('Worker CPU'))?.level).toBe('Med');\n    const short = detectBottlenecks({ history: history.slice(0, 29), echoOk: 990, echoSent: 1000, config: fakeConfig(), workerCpu: 92 });\n    expect(short.some((b) => b.title.includes('Worker CPU'))).toBe(false);\n  });\n\n  it('P95: first5 đúng biên 30 tick → vẫn chạy detector (diệt > 30)', () => {\n    const history: LoadTestTick[] = [];\n    for (let i = 0; i <"+" 30; i++) history.push(base(1_700_000_000_000 + i * 1000, {}, 100)); // 0..29s — first5\n    for (let i = 0; i <"+" 30; i++) history.push(base(1_700_000_000_000 + 301_000 + i * 1000, {}, 400)); // sau 5 phút — last5\n    const out = detectBottlenecks({ history, echoOk: 990, echoSent: 1000, config: fakeConfig(), workerCpu: 30 });\n    expect(out.some((b) => b.title.includes('P95 tăng'))).toBe(true);\n  });\n});\n\n// ─── T-11 (G-2): test mở rộng diệt mutant report.ts ────────────────────────\n\nfunction fullReportInput(over: Partial<"+"Parameters<"+"typeof buildReport>[0]> = {}) {\n  const hist = new ActionHistograms();\n  const h = new BucketedHistogram();\n  for (let i = 0; i <"+" 100; i++) h.add(120);\n  hist.mergeFrom('chat', h.buckets);\n  return {\n    runId: 'lt-test1',\n    status: 'finished' as const,\n    startAt: 1_700_000_000_000,\n    endAt: 1_700_000_002_000,\n    config: fakeConfig(),\n    tickHistory: [fakeTick(1_700_000_000_000), fakeTick(1_700_000_001_000)],\n    perActionHistograms: hist,\n    actionOk: { chat: 90 },\n    actionFail: { chat: 10 },\n    maxConnected: 10_000,\n    maxActive: 9_500,\n    maxQueue: 300,\n    peakActionsPerSec: 900,\n    provisioned: 10_000,\n    ...over,\n  };\n}\n\ndescribe('buildReport — nhánh sâu (T-11)', () => {\n  it('tickHistory rỗng → counters default, không crash, successRate 100', () => {\n    const report = buildReport({ ...fullReportInput(), tickHistory: [] });\n    expect(report.summary.actionsTotal).toBe(0);\n    expect(report.summary.successRate).toBe(100);\n    expect(report.summary.echoRate).toBe(100);\n    expect(report.summary.throughputAvg).toBe(0);\n    expect(report.summary.usersCreated).toBe(10_000); // từ provisioned\n    expect(report.durationSec).toBe(2);\n  });\n\n  it('status stopped/error + stopReason passthrough', () => {\n    const stopped = buildReport(fullReportInput({ status: 'stopped', stopReason: 'kill-switch' }));\n    expect(stopped.status).toBe('stopped');\n    expect(stopped.stopReason).toBe('kill-switch');\n    const errored = buildReport(fullReportInput({ status: 'error', stopReason: 'E1' }));\n    expect(errored.status).toBe('error');\n    expect(errored.stopReason).toBe('E1');\n  });\n\n  it('perAction sort theo count giảm dần', () => {\n    const hist = new ActionHistograms();\n    const hChat = new BucketedHistogram();\n    const hRead = new BucketedHistogram();\n    for (let i = 0; i <"+" 50; i++) hChat.add(10);\n    for (let i = 0; i <"+" 200; i++) hRead.add(20);\n    hist.mergeFrom('chat', hChat.buckets);\n    hist.mergeFrom('read', hRead.buckets);\n    const report = buildReport(fullReportInput({ perActionHistograms: hist }));\n    expect(report.perAction[0].action).toBe('read');\n    expect(report.perAction[1].action).toBe('chat');\n  });\n\n  it('noPostFixtureSkipped suy từ history errors khi input không cung cấp', () => {\n    const tick: LoadTestTick = {\n      ...fakeTick(1_700_000_000_000),\n      errors: [{ code: 'NO_POST_FIXTURE', count: 7 }],\n    };\n    const report = buildReport(fullReportInput({ tickHistory: [tick], noPostFixtureSkipped: undefined }));\n    expect(report.noPostFixtureSkipped).toBe(7);\n  });\n\n  it('actionsTotal/success/fail truyền thẳng vào summary', () => {\n    const report = buildReport(fullReportInput());\n    expect(report.summary.actionsTotal).toBe(100_000);\n    expect(report.summary.successTotal).toBe(99_000);\n    expect(report.summary.failTotal).toBe(1_000);\n    expect(report.summary.echoOk).toBe(950);\n    expect(report.summary.queueCountPeak).toBe(300);\n    expect(report.summary.throughputAvg).toBe(50_000); // 100k actions / 2s\n  });\n\n  it('successRate/echoRate CHÍNH XÁC 50/50 (diệt mutant làm tròn + bỏ /10)', () => {\n    const history = [fakeTick(1_700_000_000_000, { successTotal: 50, failTotal: 50, echoOk: 50, echoSent: 100 })];\n    const report = buildReport(fullReportInput({ tickHistory: history }));\n    expect(report.summary.successRate).toBe(50); // (50/100)*1000/10\n    expect(report.summary.echoRate).toBe(50);\n  });\n\n  it('perAction successRate CHÍNH XÁC 50 khi ok/fail cân bằng; 100 khi không có action', () => {\n    const hist = new ActionHistograms();\n    const h = new BucketedHistogram();\n    for (let i = 0; i <"+" 10; i++) h.add(100);\n    hist.mergeFrom('chat', h.buckets);\n    const report = buildReport(\n      fullReportInput({ perActionHistograms: hist, actionOk: { chat: 50 }, actionFail: { chat: 50 } }),\n    );\n    const chat = report.perAction.find((a) => a.action === 'chat');\n    expect(chat?.successRate).toBe(50);\n    const zero = buildReport(\n      fullReportInput({ perActionHistograms: new ActionHistograms(), actionOk: {}, actionFail: {} }),\n    );\n    expect(zero.perAction).toEqual([]); // không action → perAction rỗng\n  });\n});\n\ndescribe('reportToMarkdown — snapshot toàn bộ output (diệt string mutant)', () => {\n  it('markdown đầy đủ ổn định (snapshot)', () => {\n    const report = buildReport(fullReportInput());\n    expect(reportToMarkdown(report)).toMatchSnapshot();\n  });\n\n  it('markdown với status error + stopReason + bottleneck + NO_POST_FIXTURE (snapshot)', () => {\n    const tick: LoadTestTick = { ...fakeTick(1_700_000_000_000), errors: [{ code: 'NO_POST_FIXTURE', count: 5 }] };\n    const report = buildReport(fullReportInput({ status: 'error', stopReason: 'E1: register fail 60% > 50%', tickHistory: [tick] }));\n    expect(reportToMarkdown(report)).toMatchSnapshot();\n  });\n\n  it('formatMs: <"+" 1s → ms; ≥ 1s → s (2 chữ số thập phân)', () => {\n    const hist = new ActionHistograms();\n    const h = new BucketedHistogram();\n    for (let i = 0; i <"+" 50; i++) h.add(500); // <"+" 1s\n    for (let i = 0; i <"+" 50; i++) h.add(2500); // 2.5s\n    hist.mergeFrom('chat', h.buckets);\n    const report = buildReport(fullReportInput({ perActionHistograms: hist }));\n    const md = reportToMarkdown(report);\n    expect(md).toContain('| chat |'); // dòng action\n    expect(md).toMatch(/\\| chat \\| \\d+(ms|\\.\\d+s)/);\n  });\n});\n\ndescribe('ticksToCsv — snapshot (T-11)', () => {\n  it('CSV đầy đủ header + row ổn định (snapshot)', () => {\n    const csv = ticksToCsv('lt-test1', [fakeTick(1_700_000_000_000)]);\n    expect(csv).toMatchSnapshot();\n  });\n});\n\ndescribe('saveReportFiles (RE-3, T-11)', () => {\n  it('ghi JSON + MD + CSV vào dir/{runId}/, trả về dir', () => {\n    const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'lt-report-save-'));\n    const report = buildReport(fullReportInput());\n    const ticks = [fakeTick(1_700_000_000_000), fakeTick(1_700_000_001_000)];\n    const saved = saveReportFiles(report, ticks, dir);\n    expect(saved).toBe(path.join(dir, report.runId));\n    expect(fs.existsSync(path.join(dir, report.runId, `report-${report.runId}.json`))).toBe(true);\n    expect(fs.existsSync(path.join(dir, report.runId, `report-${report.runId}.md`))).toBe(true);\n    expect(fs.existsSync(path.join(dir, report.runId, `metrics-${report.runId}.csv`))).toBe(true);\n    const json = JSON.parse(fs.readFileSync(path.join(dir, report.runId, `report-${report.runId}.json`), 'utf8')) as { runId?: string; summary?: { usersCreated?: number } };\n    expect(json.runId).toBe(report.runId);\n    expect(json.summary?.usersCreated).toBe(10_000);\n  });\n\n  it('thư mục không ghi được (path là FILE) → trả về \"\" (không throw)', () => {\n    const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'lt-report-fail-'));\n    const blocker = path.join(dir, 'blocker');\n    fs.writeFileSync(blocker, 'x', 'utf8');\n    const report = buildReport(fullReportInput());\n    expect(saveReportFiles(report, [], blocker)).toBe('');\n  });\n});\n"},"loadtest/__tests__/coordinator-state.test.ts":{"tests":[{"id":"92","name":"coordinator-state — state machine cho phép transition hợp lệ"},{"id":"93","name":"coordinator-state — state machine chặn transition bất hợp lệ"},{"id":"94","name":"coordinator-state — state machine endPhaseFromStop: natural → finished, auto → error, manual → stopped"},{"id":"95","name":"coordinator-state — auto-stop dừng khi register fail > 50% và đủ sample (E1)"},{"id":"96","name":"coordinator-state — auto-stop không dừng khi sample quá ít"},{"id":"97","name":"coordinator-state — auto-stop dừng khi connect fail > 30% (E2)"},{"id":"98","name":"coordinator-state — auto-stop không dừng khi rate bình thường"},{"id":"99","name":"coordinator-state — aggregateTicks gộp counters + histogram từ nhiều worker"},{"id":"100","name":"coordinator-state — aggregateTicks latency P50/P95/P99 tính từ histogram"},{"id":"101","name":"coordinator-state — aggregateTicks empty workers → tick zeros, không crash"},{"id":"102","name":"coordinator-state — biên auto-stop (E1/E2) E1: đúng biên 50% KHÔNG dừng (điều kiện là > 50, không >=)"},{"id":"103","name":"coordinator-state — biên auto-stop (E1/E2) E1: 50.1% + 10 sample → dừng với reason chính xác; 50% + 9 sample → không dừng"},{"id":"104","name":"coordinator-state — biên auto-stop (E1/E2) E1: 49.9% → không dừng (so sánh > thật)"},{"id":"105","name":"coordinator-state — biên auto-stop (E1/E2) E2: đúng biên 30% KHÔNG dừng (điều kiện là > 30, không >=)"},{"id":"106","name":"coordinator-state — biên auto-stop (E1/E2) E2: 30.1% + 10 connect → dừng với reason chính xác; 30% + 9 connect → không dừng"},{"id":"107","name":"coordinator-state — biên auto-stop (E1/E2) E2: connect fail 29.9% → không dừng (so sánh > thật)"},{"id":"108","name":"coordinator-state — biên auto-stop (E1/E2) fail rate cao nhưng phase không phải provisioning/ramping → vẫn dừng theo input (thuần)"},{"id":"109","name":"coordinator-state — endPhaseFromStop reason mặc định (template chính xác) manual không reason → default stopReason"},{"id":"110","name":"coordinator-state — endPhaseFromStop reason mặc định (template chính xác) auto không reason → default error"},{"id":"111","name":"coordinator-state — endPhaseFromStop reason mặc định (template chính xác) natural giữ reason (có thể undefined)"},{"id":"112","name":"coordinator-state — aggregateTicks nhánh sâu (T-11) actionOk/actionFail khi worker KHÔNG có field (undefined) → không crash"},{"id":"113","name":"coordinator-state — aggregateTicks nhánh sâu (T-11) successTotal == 0 → successRate 100; echoSent == 0 → echoRate 100"},{"id":"114","name":"coordinator-state — aggregateTicks nhánh sâu (T-11) cpuPct == 0 bị bỏ qua (không làm giảm cpuAvg)"},{"id":"115","name":"coordinator-state — aggregateTicks nhánh sâu (T-11) top errors sort theo count giảm + slice 10"},{"id":"116","name":"coordinator-state — aggregateTicks nhánh sâu (T-11) errorSamples: tick sau gộp trước tick cũ, cap 20"},{"id":"117","name":"coordinator-state — aggregateTicks nhánh sâu (T-11) histogram gộp: target array do TICK ĐẦU tạo — bucket sau chỉ cộng phần chung"},{"id":"118","name":"coordinator-state — aggregateTicks nhánh sâu (T-11) roomCount = round(usersInRoom / 6)"},{"id":"119","name":"coordinator-state — aggregateTicks nhánh sâu (T-11) peakThroughput: rỗng → 0; chuỗi → max"}],"source":"import { describe, it, expect } from 'vitest';\nimport { canTransition, transition, decideAutoStop, endPhaseFromStop, aggregateTicks, peakThroughput } from '../coordinator-state';\nimport type { WorkerTick } from '../types';\n\nfunction fakeTick(workerId: number, over: Partial<"+"WorkerTick['counters']> = {}): WorkerTick {\n  return {\n    type: 'tick',\n    workerId,\n    ts: 1_700_000_000_000,\n    phase: 'steady',\n    counters: {\n      usersTotal: 100, usersCreated: 100, usersConnected: 100, usersActive: 100,\n      usersQueued: 5, usersInRoom: 60, actionsTotal: 1000, successTotal: 950,\n      failTotal: 50, echoOk: 90, echoSent: 100, droppedOutbox: 0, reconnectCount: 2,\n      rateLimitedNoEcho: 10, connectAttempts: 100, connectFails: 5, ...over,\n    },\n    actionsPerSec: { chat: 10, read: 20 },\n    actionOk: { chat: 9, read: 19 },\n    actionFail: { chat: 1, read: 1 },\n    errors: { HTTP_429: 3 },\n    errorSamples: [{ ts: 1, action: 'chat', code: 'HTTP_429', message: 'x', userId: 'u' }],\n    histograms: { chat: [5, 10, 0] },\n    histogramBucketCount: 3,\n    cpuPct: 40,\n    rssMb: 100,\n  };\n}\n\ndescribe('coordinator-state — state machine', () => {\n  it('cho phép transition hợp lệ', () => {\n    expect(canTransition('idle', 'provisioning')).toBe(true);\n    expect(canTransition('provisioning', 'ramping')).toBe(true);\n    expect(canTransition('ramping', 'steady')).toBe(true);\n    expect(canTransition('steady', 'cooldown')).toBe(true);\n    expect(canTransition('cooldown', 'report')).toBe(true);\n    expect(canTransition('report', 'finished')).toBe(true);\n  });\n\n  it('chặn transition bất hợp lệ', () => {\n    expect(canTransition('idle', 'steady')).toBe(false);\n    expect(canTransition('finished', 'ramping')).toBe(false);\n    expect(() => transition('idle', 'steady')).toThrow();\n  });\n\n  it('endPhaseFromStop: natural → finished, auto → error, manual → stopped', () => {\n    expect(endPhaseFromStop('natural').phase).toBe('finished');\n    expect(endPhaseFromStop('auto', 'E1').phase).toBe('error');\n    expect(endPhaseFromStop('manual').phase).toBe('stopped');\n    expect(endPhaseFromStop('auto', 'E1').stopReason).toBe('E1');\n  });\n});\n\ndescribe('coordinator-state — auto-stop', () => {\n  it('dừng khi register fail > 50% và đủ sample (E1)', () => {\n    const d = decideAutoStop({ phase: 'provisioning', registerFailRate: 60, connectFailRate: 0, registeredTotal: 20, connectTotal: 0 });\n    expect(d.stop).toBe(true);\n    expect(d.reason).toContain('E1');\n  });\n\n  it('không dừng khi sample quá ít', () => {\n    const d = decideAutoStop({ phase: 'provisioning', registerFailRate: 100, connectFailRate: 0, registeredTotal: 3, connectTotal: 0 });\n    expect(d.stop).toBe(false);\n  });\n\n  it('dừng khi connect fail > 30% (E2)', () => {\n    const d = decideAutoStop({ phase: 'ramping', registerFailRate: 0, connectFailRate: 40, registeredTotal: 0, connectTotal: 50 });\n    expect(d.stop).toBe(true);\n    expect(d.reason).toContain('E2');\n  });\n\n  it('không dừng khi rate bình thường', () => {\n    const d = decideAutoStop({ phase: 'steady', registerFailRate: 10, connectFailRate: 5, registeredTotal: 100, connectTotal: 100 });\n    expect(d.stop).toBe(false);\n  });\n});\n\ndescribe('coordinator-state — aggregateTicks', () => {\n  it('gộp counters + histogram từ nhiều worker', () => {\n    const ticks = [fakeTick(0), fakeTick(1, { actionsTotal: 2000, successTotal: 1950, failTotal: 50, usersConnected: 50 })];\n    const agg = aggregateTicks('run1', 1_700_000_001_000, 10, 'steady', ticks);\n\n    expect(agg.tick.counters.actionsTotal).toBe(3000);\n    expect(agg.tick.counters.usersConnected).toBe(150);\n    expect(agg.tick.counters.roomCount).toBe(20); // 120 in_room / 6\n    expect(agg.tick.rates.successRate).toBeCloseTo(96.7, 1);\n    expect(agg.tick.actionsPerSec.chat).toBe(20);\n    expect(agg.tick.actionsPerSec.read).toBe(40);\n    // histogram gộp: chat [10, 20, 0]\n    expect(agg.perActionHistograms.chat).toEqual([10, 20, 0]);\n    // per-action ok/fail gộp\n    expect(agg.actionOk.chat).toBe(18);\n    expect(agg.actionFail.chat).toBe(2);\n    // top errors gộp: HTTP_429 = 6\n    const err = agg.tick.errors.find((e) => e.code === 'HTTP_429');\n    expect(err?.count).toBe(6);\n  });\n\n  it('latency P50/P95/P99 tính từ histogram', () => {\n    // 100 sample ở bucket nhỏ nhất (1ms)\n    const tick = fakeTick(0, {});\n    const agg = aggregateTicks('run1', 1_700_000_001_000, 1, 'steady', [tick]);\n    expect(agg.tick.latency.p50).toBeGreaterThanOrEqual(1);\n  });\n\n  it('empty workers → tick zeros, không crash', () => {\n    const agg = aggregateTicks('run1', 1_700_000_001_000, 1, 'ramping', []);\n    expect(agg.tick.counters.actionsTotal).toBe(0);\n    expect(agg.tick.rates.successRate).toBe(100);\n  });\n});\n\n// ─── T-11 (G-2): test mở rộng diệt mutant coordinator-state.ts ─────────────\n\ndescribe('coordinator-state — biên auto-stop (E1/E2)', () => {\n  it('E1: đúng biên 50% KHÔNG dừng (điều kiện là > 50, không >=)', () => {\n    const at = decideAutoStop({ phase: 'provisioning', registerFailRate: 50, connectFailRate: 0, registeredTotal: 10, connectTotal: 0 });\n    expect(at.stop).toBe(false);\n    expect(at.reason).toBeUndefined();\n  });\n\n  it('E1: 50.1% + 10 sample → dừng với reason chính xác; 50% + 9 sample → không dừng', () => {\n    const over = decideAutoStop({ phase: 'provisioning', registerFailRate: 50.1, connectFailRate: 0, registeredTotal: 10, connectTotal: 0 });\n    expect(over.stop).toBe(true);\n    expect(over.reason).toBe('auto-stop: register fail 50% > 50% (E1)');\n    const below = decideAutoStop({ phase: 'provisioning', registerFailRate: 50, connectFailRate: 0, registeredTotal: 9, connectTotal: 0 });\n    expect(below.stop).toBe(false);\n  });\n\n  it('E1: 49.9% → không dừng (so sánh > thật)', () => {\n    expect(decideAutoStop({ phase: 'provisioning', registerFailRate: 49.9, connectFailRate: 0, registeredTotal: 100, connectTotal: 0 }).stop).toBe(false);\n  });\n\n  it('E2: đúng biên 30% KHÔNG dừng (điều kiện là > 30, không >=)', () => {\n    const at = decideAutoStop({ phase: 'ramping', registerFailRate: 0, connectFailRate: 30, registeredTotal: 0, connectTotal: 10 });\n    expect(at.stop).toBe(false);\n    expect(at.reason).toBeUndefined();\n  });\n\n  it('E2: 30.1% + 10 connect → dừng với reason chính xác; 30% + 9 connect → không dừng', () => {\n    const over = decideAutoStop({ phase: 'ramping', registerFailRate: 0, connectFailRate: 30.1, registeredTotal: 0, connectTotal: 10 });\n    expect(over.stop).toBe(true);\n    expect(over.reason).toBe('auto-stop: connect fail 30% > 30% (E2)');\n    const below = decideAutoStop({ phase: 'ramping', registerFailRate: 0, connectFailRate: 30, registeredTotal: 0, connectTotal: 9 });\n    expect(below.stop).toBe(false);\n  });\n\n  it('E2: connect fail 29.9% → không dừng (so sánh > thật)', () => {\n    expect(decideAutoStop({ phase: 'ramping', registerFailRate: 0, connectFailRate: 29.9, registeredTotal: 0, connectTotal: 100 }).stop).toBe(false);\n  });\n\n  it('fail rate cao nhưng phase không phải provisioning/ramping → vẫn dừng theo input (thuần)', () => {\n    const d = decideAutoStop({ phase: 'error', registerFailRate: 100, connectFailRate: 100, registeredTotal: 20, connectTotal: 20 });\n    expect(d.stop).toBe(true);\n  });\n});\n\ndescribe('coordinator-state — endPhaseFromStop reason mặc định (template chính xác)', () => {\n  it('manual không reason → default stopReason', () => {\n    expect(endPhaseFromStop('manual').stopReason).toBe('run bị dừng thủ công (kill-switch)');\n  });\n  it('auto không reason → default error', () => {\n    expect(endPhaseFromStop('auto').stopReason).toBe('run tự dừng do lỗi');\n  });\n  it('natural giữ reason (có thể undefined)', () => {\n    expect(endPhaseFromStop('natural', 'duration hết').stopReason).toBe('duration hết');\n    expect(endPhaseFromStop('natural').stopReason).toBeUndefined();\n  });\n});\n\ndescribe('coordinator-state — aggregateTicks nhánh sâu (T-11)', () => {\n  it('actionOk/actionFail khi worker KHÔNG có field (undefined) → không crash', () => {\n    const t = {\n      ...fakeTick(0),\n      actionOk: undefined,\n      actionFail: undefined,\n      histograms: undefined,\n      errorSamples: undefined,\n    } as unknown as WorkerTick;\n    const agg = aggregateTicks('run1', 1_700_000_001_000, 1, 'steady', [t]);\n    expect(agg.actionOk.chat).toBeUndefined();\n    expect(agg.tick.counters.actionsTotal).toBe(1000);\n    expect(agg.tick.latency.p50).toBe(0);\n  });\n\n  it('successTotal == 0 → successRate 100; echoSent == 0 → echoRate 100', () => {\n    const t: WorkerTick = { ...fakeTick(0), counters: { ...fakeTick(0).counters, successTotal: 0, failTotal: 0, echoOk: 0, echoSent: 0 } };\n    const agg = aggregateTicks('run1', 1_700_000_001_000, 1, 'steady', [t]);\n    expect(agg.tick.rates.successRate).toBe(100);\n    expect(agg.tick.rates.echoRate).toBe(100);\n  });\n\n  it('cpuPct == 0 bị bỏ qua (không làm giảm cpuAvg)', () => {\n    const t0 = fakeTick(0, {});\n    const t1: WorkerTick = { ...fakeTick(1, {}), cpuPct: 0 };\n    const agg = aggregateTicks('run1', 1_700_000_001_000, 1, 'steady', [t0, t1]);\n    expect(agg.tick.workers.cpuAvg).toBe(40); // chỉ 1 worker có cpu\n  });\n\n  it('top errors sort theo count giảm + slice 10', () => {\n    const t = fakeTick(0, {});\n    t.errors = { A: 1, B: 9, C: 2 };\n    const agg = aggregateTicks('run1', 1_700_000_001_000, 1, 'steady', [t]);\n    expect(agg.tick.errors.map((e) => e.code)).toEqual(['B', 'C', 'A']);\n  });\n\n  it('errorSamples: tick sau gộp trước tick cũ, cap 20', () => {\n    const mk = (prefix: string, n: number) =>\n      Array.from({ length: n }, (_, i) => ({\n        ts: i, action: 'chat' as const, code: `${prefix}${i}`, message: 'm', userId: 'u',\n      }));\n    const t0 = { ...fakeTick(0), errorSamples: mk('E', 5) }; // 5 mẫu cũ\n    const t1 = { ...fakeTick(1), errorSamples: mk('F', 25) }; // 25 mẫu mới\n    const agg = aggregateTicks('run1', 1_700_000_001_000, 1, 'steady', [t0, t1]);\n    expect(agg.errorSamples).toHaveLength(20);\n    expect(agg.errorSamples[0].code).toBe('F0'); // mẫu của tick xử lý sau đứng trước\n    expect(agg.errorSamples[19].code).toBe('F19');\n    expect(agg.errorSamples.some((s) => s.code.startsWith('E'))).toBe(false); // mẫu cũ bị cắt\n  });\n\n  it('histogram gộp: target array do TICK ĐẦU tạo — bucket sau chỉ cộng phần chung', () => {\n    const t0 = fakeTick(0, {}); // histogramBucketCount 3\n    const t1: WorkerTick = {\n      ...fakeTick(1, {}),\n      histograms: { chat: [1, 2, 3, 4, 5, 6, 7, 8] },\n      histogramBucketCount: 8,\n    };\n    const agg = aggregateTicks('run1', 1_700_000_001_000, 1, 'steady', [t0, t1]);\n    // bucket 0-2: t0 [5,10,0] + t1 [1,2,3]; bucket 3-7: KHÔNG có target (giữ len 3)\n    expect(agg.perActionHistograms.chat).toEqual([6, 12, 3]);\n  });\n\n  it('roomCount = round(usersInRoom / 6)', () => {\n    const t = fakeTick(0, { usersInRoom: 7 });\n    const agg = aggregateTicks('run1', 1_700_000_001_000, 1, 'steady', [t]);\n    expect(agg.tick.counters.roomCount).toBe(1);\n  });\n\n  it('peakThroughput: rỗng → 0; chuỗi → max', () => {\n    expect(peakThroughput([])).toBe(0);\n    expect(peakThroughput([1, 5, 3, 9, 2])).toBe(9);\n  });\n});\n"},"loadtest/__tests__/metrics.test.ts":{"tests":[{"id":"120","name":"BucketedHistogram P50/P95/P99 đúng với dữ liệu cố định"},{"id":"121","name":"BucketedHistogram quantile trả 0 khi rỗng"},{"id":"122","name":"BucketedHistogram merge histogram"},{"id":"123","name":"BucketedHistogram bucketIndex clamp ở biên"},{"id":"124","name":"BucketedHistogram merge từ plain object { buckets } — count/sum ước lượng qua mid-bucket"},{"id":"125","name":"BucketedHistogram merge bucket ngắn hơn (len mismatch) → không crash, chỉ cộng phần chung"},{"id":"126","name":"BucketedHistogram add(0) / giá trị dưới min → bucket 0; trên max → bucket cuối (clamp chính xác)"},{"id":"127","name":"BucketedHistogram quantiles() khi chỉ có 1 sample ở bucket 0 → avg = sum chính xác"},{"id":"128","name":"BucketedHistogram toJSON trả về chính buckets array"},{"id":"129","name":"ActionHistograms add/mergeFrom tạo histogram mới + get theo action"},{"id":"130","name":"ActionHistograms mergedTotal gộp toàn bộ action (latency tổng P50/P95/P99)"},{"id":"131","name":"ActionHistograms toJSON: record action → buckets array"},{"id":"132","name":"ActionHistograms mergeFrom với bucket ngắn hơn (len khác) → không crash"},{"id":"133","name":"Counter inc/get/reset"},{"id":"134","name":"SlidingWindow failRatePct tính đúng trong cửa sổ"},{"id":"135","name":"SlidingWindow rỗng → 0"},{"id":"136","name":"SlidingWindow loại bỏ entry cũ ngoài cửa sổ"},{"id":"137","name":"SlidingWindow entry hết hạn bị loại khỏi window (dùng fake timers Date)"},{"id":"138","name":"SlidingWindow failRatePct chính xác 0%/50%/100% (biên)"}],"source":"import { describe, it, expect, vi } from 'vitest';\nimport { BucketedHistogram, SlidingWindow, ActionHistograms, Counter, HISTOGRAM_BUCKETS, HISTOGRAM_MAX_MS } from '../metrics';\n\ndescribe('BucketedHistogram', () => {\n  it('P50/P95/P99 đúng với dữ liệu cố định', () => {\n    const h = new BucketedHistogram();\n    for (let i = 0; i <"+" 100; i++) h.add(i % 2 === 0 ? 100 : 200); // 50× 100ms, 50× 200ms\n    const q = h.quantiles();\n    // bucket log-scale: giá trị trả về là mid-bucket, cho phép tolerance\n    expect(q.p50).toBeGreaterThanOrEqual(50);\n    expect(q.p50).toBeLessThanOrEqual(160);\n    expect(q.p95).toBeGreaterThanOrEqual(150);\n    expect(q.p95).toBeLessThanOrEqual(260);\n    expect(q.p99).toBeLessThanOrEqual(260);\n    expect(q.count).toBe(100);\n    expect(q.avg).toBe(150); // avg chính xác — sum giữ nguyên\n  });\n\n  it('quantile trả 0 khi rỗng', () => {\n    const h = new BucketedHistogram();\n    expect(h.quantile(0.95)).toBe(0);\n    expect(h.quantiles().count).toBe(0);\n  });\n\n  it('merge histogram', () => {\n    const a = new BucketedHistogram();\n    const b = new BucketedHistogram();\n    a.add(100);\n    b.add(200);\n    b.add(300);\n    a.merge(b);\n    expect(a.getCount()).toBe(3);\n  });\n\n  it('bucketIndex clamp ở biên', () => {\n    const h = new BucketedHistogram();\n    h.add(0.1); // dưới min → bucket 0\n    h.add(999_999); // trên max → bucket cuối\n    expect(h.getCount()).toBe(2);\n  });\n\n  // ─── T-11 (G-2): test mở rộng diệt mutant metrics.ts ─────────────────────\n\n  it('merge từ plain object { buckets } — count/sum ước lượng qua mid-bucket', () => {\n    const a = new BucketedHistogram();\n    a.add(100);\n    const plain = new Array(HISTOGRAM_BUCKETS).fill(0);\n    plain[0] = 10; // 10 sample ở bucket đầu (1ms)\n    a.merge({ buckets: plain });\n    expect(a.getCount()).toBe(11);\n    // sum = sum(mid-bucket * count) — mid(0) = exp(log(1) + 0.5/48 * span) > 1\n    expect(a.getSum()).toBeGreaterThan(10);\n    expect(a.getSum()).toBeLessThan(100 * 1000);\n  });\n\n  it('merge bucket ngắn hơn (len mismatch) → không crash, chỉ cộng phần chung', () => {\n    const a = new BucketedHistogram();\n    a.add(50);\n    a.merge({ buckets: [1, 2, 3] }); // ngắn hơn 48\n    // count = sample thật + mọi bucket khác 0 của object (count từ mid-bucket)\n    expect(a.getCount()).toBe(1 + 1 + 2 + 3);\n    expect(a.buckets[0]).toBeGreaterThanOrEqual(1);\n  });\n\n  it('add(0) / giá trị dưới min → bucket 0; trên max → bucket cuối (clamp chính xác)', () => {\n    const h = new BucketedHistogram();\n    h.add(-5);\n    h.add(HISTOGRAM_MAX_MS * 10);\n    expect(h.buckets[0]).toBe(1);\n    expect(h.buckets[HISTOGRAM_BUCKETS - 1]).toBe(1);\n  });\n\n  it('quantiles() khi chỉ có 1 sample ở bucket 0 → avg = sum chính xác', () => {\n    const h = new BucketedHistogram();\n    h.add(1);\n    const q = h.quantiles();\n    expect(q.avg).toBe(1);\n    expect(q.count).toBe(1);\n    expect(q.p50).toBeGreaterThanOrEqual(1);\n  });\n\n  it('toJSON trả về chính buckets array', () => {\n    const h = new BucketedHistogram();\n    h.add(10);\n    expect(h.toJSON()).toHaveLength(HISTOGRAM_BUCKETS);\n    expect(h.toJSON().reduce((a, b) => a + b, 0)).toBe(1); // đúng 1 sample\n  });\n});\n\ndescribe('ActionHistograms', () => {\n  it('add/mergeFrom tạo histogram mới + get theo action', () => {\n    const ah = new ActionHistograms();\n    ah.add('chat', 100);\n    ah.add('chat', 200);\n    ah.mergeFrom('read', new Array(HISTOGRAM_BUCKETS).fill(0).map((_, i) => (i === 5 ? 3 : 0)));\n    expect(ah.get('chat')?.getCount()).toBe(2);\n    expect(ah.get('read')?.getCount()).toBe(3);\n    expect(ah.get('view')).toBeUndefined();\n    expect(ah.keys().sort()).toEqual(['chat', 'read']);\n  });\n\n  it('mergedTotal gộp toàn bộ action (latency tổng P50/P95/P99)', () => {\n    const ah = new ActionHistograms();\n    ah.add('chat', 100);\n    ah.add('read', 200);\n    const total = ah.mergedTotal();\n    expect(total.getCount()).toBe(2);\n    expect(total.quantiles().avg).toBe(150);\n  });\n\n  it('toJSON: record action → buckets array', () => {\n    const ah = new ActionHistograms();\n    ah.add('chat', 10);\n    const json = ah.toJSON();\n    expect(Object.keys(json)).toEqual(['chat']);\n    expect(json.chat).toHaveLength(HISTOGRAM_BUCKETS);\n  });\n\n  it('mergeFrom với bucket ngắn hơn (len khác) → không crash', () => {\n    const ah = new ActionHistograms();\n    ah.mergeFrom('topic', [1, 2]);\n    expect(ah.get('topic')?.getCount()).toBe(1 + 2); // count từ bucket ≠ 0\n  });\n});\n\ndescribe('Counter', () => {\n  it('inc/get/reset', () => {\n    const c = new Counter();\n    expect(c.get()).toBe(0);\n    c.inc();\n    c.inc(3);\n    expect(c.get()).toBe(4);\n    c.reset();\n    expect(c.get()).toBe(0);\n  });\n});\n\ndescribe('SlidingWindow', () => {\n  it('failRatePct tính đúng trong cửa sổ', () => {\n    const w = new SlidingWindow(60_000);\n    w.add(true);\n    w.add(false);\n    w.add(false);\n    expect(w.failRatePct()).toBeCloseTo(66.7, 1);\n  });\n\n  it('rỗng → 0', () => {\n    expect(new SlidingWindow().failRatePct()).toBe(0);\n  });\n\n  it('loại bỏ entry cũ ngoài cửa sổ', () => {\n    const w = new SlidingWindow(1000);\n    w.add(true); // ngay bây giờ\n    const old = { ts: Date.now() - 5000, ok: false } as never;\n    // chèn entry cũ giả lập (chỉ test qua việc window trượt)\n    void old;\n    w.add(false);\n    expect(w.size).toBeGreaterThanOrEqual(2);\n  });\n\n  // ─── T-11 (G-2): test mở rộng diệt mutant SlidingWindow ───────────────────\n\n  it('entry hết hạn bị loại khỏi window (dùng fake timers Date)', () => {\n    vi.useFakeTimers({ toFake: ['Date'] });\n    try {\n      const w = new SlidingWindow(1000);\n      w.add(true);\n      w.add(false);\n      expect(w.size).toBe(2);\n      vi.advanceTimersByTime(2000); // cả 2 entry hết hạn\n      w.add(true);\n      expect(w.size).toBe(1); // 2 entry cũ bị shift\n      expect(w.failRatePct()).toBe(0);\n    } finally {\n      vi.useRealTimers();\n    }\n  });\n\n  it('failRatePct chính xác 0%/50%/100% (biên)', () => {\n    const w = new SlidingWindow(60_000);\n    expect(w.failRatePct()).toBe(0);\n    w.add(true);\n    expect(w.failRatePct()).toBe(0);\n    w.add(false);\n    expect(w.failRatePct()).toBe(50);\n    w.add(false);\n    expect(w.failRatePct()).toBeCloseTo(66.7, 1);\n  });\n});\n"}},"projectRoot":"C:\\MAYogu_VIASG\\chat-app","config":{"mutate":["loadtest/coordinator-state.ts","loadtest/metrics.ts","loadtest/config.ts","loadtest/report.ts"],"testRunner":"vitest","vitest":{"configFile":"loadtest/vitest.mutation.config.ts","related":true},"concurrency":2,"maxConcurrentTestRunners":2,"timeoutMS":60000,"timeoutFactor":2,"reporters":["clear-text","progress","html"],"htmlReporter":{"fileName":"reports\\mutation\\html\\index.html"},"coverageAnalysis":"perTest","thresholds":{"break":70,"high":80,"low":60},"configFile":"stryker.config.mjs","allowConsoleColors":true,"checkers":[],"checkerNodeArgs":[],"commandRunner":{"command":"npm test"},"clearTextReporter":{"allowColor":true,"allowEmojis":false,"logTests":true,"maxTestsToLog":3,"reportTests":true,"reportMutants":true,"reportScoreTable":true,"skipFull":false},"dashboard":{"baseUrl":"https://dashboard.stryker-mutator.io/api/reports","reportType":"full"},"dryRunOnly":false,"eventReporter":{"baseDir":"reports/mutation/events"},"ignorePatterns":[],"ignoreStatic":false,"incremental":false,"incrementalFile":"reports/stryker-incremental.json","force":false,"fileLogLevel":"off","inPlace":false,"logLevel":"info","maxTestRunnerReuse":0,"mutator":{"plugins":null,"excludedMutations":[]},"plugins":["@stryker-mutator/*"],"appendPlugins":[],"jsonReporter":{"fileName":"reports/mutation/mutation.json"},"disableTypeChecks":true,"symlinkNodeModules":true,"tempDirName":".stryker-tmp","cleanTempDir":true,"testRunnerNodeArgs":[],"dryRunTimeoutMinutes":5,"tsconfigFile
