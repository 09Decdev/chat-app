,"coveredBy":["23"],"location":{"end":{"column":26,"line":343},"start":{"column":22,"line":343}}},{"id":"371","mutatorName":"ObjectLiteral","replacement":"{}","statusReason":"expected [ '10k', '50k', '100k', '1M', …(1) ] to deeply equal [ '10k', '50k', '100k', '1M', '10M' ]","status":"Killed","static":true,"testsCompleted":63,"killedBy":["62"],"coveredBy":["23"],"location":{"end":{"column":78,"line":344},"start":{"column":3,"line":344}}},{"id":"372","mutatorName":"StringLiteral","replacement":"\"\"","statusReason":"expected [ '10k', '50k', '100k', '1M', '' ] to deeply equal [ '10k', '50k', '100k', '1M', '10M' ]","status":"Killed","static":true,"testsCompleted":63,"killedBy":["62"],"coveredBy":["23"],"location":{"end":{"column":14,"line":344},"start":{"column":9,"line":344}}},{"id":"373","mutatorName":"StringLiteral","replacement":"\"\"","status":"Survived","static":true,"testsCompleted":63,"coveredBy":["23"],"location":{"end":{"column":28,"line":344},"start":{"column":23,"line":344}}},{"id":"374","mutatorName":"BooleanLiteral","replacement":"false","statusReason":"expected false to be true // Object.is equality","status":"Killed","static":true,"testsCompleted":63,"killedBy":["62"],"coveredBy":["23"],"location":{"end":{"column":76,"line":344},"start":{"column":72,"line":344}}},{"id":"375","mutatorName":"ObjectLiteral","replacement":"{}","statusReason":"expected false to be true // Object.is equality","status":"Killed","static":true,"testsCompleted":4,"killedBy":["3"],"coveredBy":["23"],"location":{"end":{"column":101,"line":347},"start":{"column":47,"line":347}}},{"id":"401","mutatorName":"ArithmeticOperator","replacement":"process.pid * 46656","status":"Survived","static":true,"testsCompleted":63,"coveredBy":["23"],"location":{"end":{"column":37,"line":366},"start":{"column":18,"line":366}}},{"id":"402","mutatorName":"StringLiteral","replacement":"\"\"","status":"Survived","static":true,"testsCompleted":63,"coveredBy":["23"],"location":{"end":{"column":67,"line":366},"start":{"column":64,"line":366}}}],"source":"/**\n * MAYogu LoadTest Tool — cấu hình env + validation run + presets (CP-1).\n *\n * - Env đọc từ loadtest/.env (KV đơn giản, không thêm dependency dotenv).\n * - Allowlist test (SD-1): chặn cứng mọi gateway URL không nằm trong danh sách.\n * - Preset 1M/10M là preset có cảnh báo hạ tầng — server chặn cứng target > maxTarget\n *   (PRD §8: MVP = 10k-100k đúng trên 1 máy; 1M/10M cần cluster v1.1).\n */\n\nimport * as fs from 'node:fs';\nimport * as os from 'node:os';\nimport * as path from 'node:path';\nimport { fileURLToPath } from 'node:url';\nimport type { ActionProfile, RunConfig, StartRunRequest } from './types';\nimport { normalizeUrl, parseBool, ltLog, redactUrl } from './util';\n\n/** loadtest/ dir (ESM-safe). */\nexport const LOADTEST_DIR = fileURLToPath(new URL('.', import.meta.url));\n\n/** Placeholder DB URL (C-2) — thay credential mặc định đã bị xoá; validateEnv fail-fast khi gặp. */\nexport const PLACEHOLDER_DB_URL = 'postgresql://USER:PASS@HOST:PORT/DB';\n/** Default credential cũ (đã bị xoá khỏi code) — validateEnv vẫn chặn đúng chuỗi này. */\nexport const DEFAULT_DEV_DB_URL = 'postgresql://appuser:secret@localhost:5439/loadtest';\n\n/**\n * Chặn đúng 2 chuỗi known-bad (T-03): placeholder + default credential cũ.\n * KHÔNG dùng substring match `appuser`/`:secret@` — sẽ false-positive lên URL\n * dev hợp lệ có username `appuser` + password thật (loadtest/.env).\n */\nexport function isKnownBadDbUrl(url: string): boolean {\n  return url === PLACEHOLDER_DB_URL || url === DEFAULT_DEV_DB_URL;\n}\n\nexport interface LoadTestEnv {\n  port: number;\n  /** Host API điều khiển — mặc định 127.0.0.1 (không expose ra ngoài máy). */\n  host: string;\n  allowlist: string[]; // gateway URLs được phép chạy (normalized http)\n  gatewayUrl: string;\n  otpSecret: string;\n  /** Secret ký session token (auth.ts loadAuthSecret) — raw env, rỗng = fallback tự sinh (dev-only). */\n  authSecret: string;\n  redisUrl: string;\n  maxTarget: number;\n  maxDurationMin: number;\n  maxRegisterRamp: number;\n  workerCount: number; // 0 = auto\n  maxSocketsPerWorker: number;\n  maxPendingOutbox: number;\n  dataDir: string;\n  reportsDir: string;\n  databaseUrl: string;\n  scrapeIntervalMs: number;\n  registerRamp: number;\n  /** Nội dung tĩnh cho REST driver: postId fixtures (rỗng → driver tự bỏ qua POST create). */\n  fixturePostIds: string[];\n  /** Tên phòng chat test (matching không cần — server tự tạo). */\n  debug: boolean;\n  /** Bắt buộc DB kết nối để server start (Q-2) — mặc định true. */\n  dbRequired: boolean;\n  /** CORS allowlist (T-06) — echo origin nếu khớp, KHÔNG `*` (SEC-2). Default http://localhost:5173 (R-7). */\n  corsOrigins: string[];\n  /** Register gate (SEC-6) — mặc định false (dev set true). */\n  allowRegister: boolean;\n  /** Rate-limit escape hatch (test/CI — PLAN R-6). */\n  rateLimitDisabled: boolean;\n  /** Số fail login/register trong window → 429 (mặc định 5). */\n  rateLimitLoginFails: number;\n  /** Cửa sổ fail window (ms) — mặc định 60s. */\n  rateLimitWindowMs: number;\n  /** Refill interval /start bucket (ms) — mặc định 10s (1 req/10s). */\n  rateLimitStartMs: number;\n  /** Write bucket (req/min) cho /allowlist POST, /cleanup, DELETE /runs — 0 = OFF (mặc định). */\n  rateLimitWriteBucket: number;\n  /** Tin X-Forwarded-For (chống spoof header — mặc định false). */\n  trustProxy: boolean;\n  /** Tổng timeout graceful shutdown (ms) — mặc định 10s (PRD §5.2). */\n  shutdownTimeoutMs: number;\n}\n\nexport function loadDotEnv(dir: string): Record<"+"string, string> {\n  const out: Record<"+"string, string> = {};\n  const file = path.join(dir, '.env');\n  if (!fs.existsSync(file)) return out;\n  try {\n    for (const raw of fs.readFileSync(file, 'utf8').split(/\\r?\\n/)) {\n      const line = raw.trim();\n      if (!line || line.startsWith('#')) continue;\n      const eq = line.indexOf('=');\n      if (eq <"+"= 0) continue;\n      const key = line.slice(0, eq).trim();\n      let value = line.slice(eq + 1).trim();\n      if ((value.startsWith('\"') && value.endsWith('\"')) || (value.startsWith(\"'\") && value.endsWith(\"'\"))) {\n        value = value.slice(1, -1);\n      }\n      out[key] = value;\n    }\n  } catch (e) {\n    ltLog.warn(`Không đọc được loadtest/.env: ${String(e)}`);\n  }\n  return out;\n}\n\nlet cachedEnv: LoadTestEnv | null = null;\n\n/** C-4: in nguồn từng key (process.env / .env file / override) khi LOADTEST_DEBUG. */\nfunction logEnvSources(\n  processEnv: Record<"+"string, string | undefined>,\n  fromFile: Record<"+"string, string>,\n  overrides: Record<"+"string, string>,\n): void {\n  const keys = new Set<"+"string>();\n  for (const k of Object.keys(processEnv)) if (k.startsWith('LOADTEST_')) keys.add(k);\n  for (const k of Object.keys(fromFile)) keys.add(k);\n  for (const k of Object.keys(overrides)) keys.add(k);\n  const sorted = [...keys].sort();\n  for (const key of sorted) {\n    let source: string;\n    if (key in overrides) source = 'override';\n    else if (key in processEnv) source = 'process.env';\n    else if (key in fromFile) source = '.env file';\n    else source = 'default';\n    ltLog.info(`[env] ${key} ← ${source}`);\n  }\n}\n\n/**\n * Merge 3 nguồn env (T-03): process.env (cao nhất) > .env file > defaults.\n * `process.env` phải thắng .env file — shell env có thể override file.\n */\nexport function mergeEnvSources(\n  processEnv: Record<"+"string, string | undefined>,\n  fromFile: Record<"+"string, string>,\n  overrides: Record<"+"string, string>,\n): Record<"+"string, string | undefined> {\n  return { ...fromFile, ...processEnv, ...overrides };\n}\n\nexport function getEnv(overrides: Record<"+"string, string> = {}): LoadTestEnv {\n  if (cachedEnv && Object.keys(overrides).length === 0) return cachedEnv;\n  const fromFile = loadDotEnv(LOADTEST_DIR);\n  const env = mergeEnvSources(process.env, fromFile, overrides);\n\n  const num = (key: string, def: number): number => {\n    const v = env[key];\n    if (v === undefined || v === '') return def;\n    const n = Number(v);\n    return Number.isFinite(n) ? n : def;\n  };\n\n  const allowlistRaw = (env.LOADTEST_ALLOWLIST ?? '').trim();\n  const allowlist = allowlistRaw\n    ? allowlistRaw.split(',').map((s) => normalizeUrl(s)).filter(Boolean)\n    : [normalizeUrl('http://localhost:3000')]; // dev-only mặc định (SEC-7): production phải set LOADTEST_ALLOWLIST tường minh\n\n  const corsOriginsRaw = (env.LOADTEST_CORS_ORIGIN ?? '').trim();\n  const corsOrigins = corsOriginsRaw\n    ? corsOriginsRaw.split(',').map((s) => s.trim()).filter(Boolean)\n    : ['http://localhost:5173']; // R-7: Vite proxy gửi origin Vite\n\n  const configuredWorkers = num('LOADTEST_WORKERS', 0);\n  const debug = parseBool(env.LOADTEST_DEBUG);\n  const dbRequired = parseBool(env.LOADTEST_DB_REQUIRED, true); // Q-2: DB luôn bắt buộc\n\n  if (debug) logEnvSources(process.env, fromFile, overrides);\n\n  const cfg: LoadTestEnv = {\n    port: num('LOADTEST_PORT', 3401),\n    host: env.LOADTEST_HOST || '127.0.0.1',\n    allowlist,\n    gatewayUrl: normalizeUrl(env.LOADTEST_GATEWAY_URL || 'http://localhost:3000'),\n    otpSecret: env.LOADTEST_OTP_SECRET || '',\n    authSecret: env.LOADTEST_AUTH_SECRET || '',\n    redisUrl: env.LOADTEST_REDIS_URL || 'redis://localhost:6379',\n    maxTarget: num('LOADTEST_MAX_TARGET', 200_000),\n    maxDurationMin: num('LOADTEST_MAX_DURATION_MIN', 60),\n    maxRegisterRamp: num('LOADTEST_MAX_REGISTER_RAMP', 100),\n    workerCount: configuredWorkers,\n    maxSocketsPerWorker: num('LOADTEST_MAX_SOCKETS_PER_WORKER', 10_000),\n    maxPendingOutbox: num('LOADTEST_MAX_PENDING_OUTBOX', 1000),\n    dataDir: env.LOADTEST_DATA_DIR || './loadtest/data',\n    reportsDir: env.LOADTEST_REPORTS_DIR || './docs/loadtest-reports',\n    databaseUrl: env.LOADTEST_DATABASE_URL || PLACEHOLDER_DB_URL,\n    scrapeIntervalMs: num('LOADTEST_SCRAPE_METRICS_INTERVAL_MS', 5000),\n    registerRamp: num('LOADTEST_REGISTER_RAMP', 100),\n    fixturePostIds: (env.LOADTEST_FIXTURE_POST_IDS || '')\n      .split(',')\n      .map((s) => s.trim())\n      .filter(Boolean),\n    debug,\n    dbRequired,\n    corsOrigins,\n    allowRegister: parseBool(env.LOADTEST_ALLOW_REGISTER),\n    rateLimitDisabled: parseBool(env.LOADTEST_RATE_LIMIT_DISABLED),\n    rateLimitLoginFails: num('LOADTEST_RATE_LIMIT_LOGIN_FAILS', 5),\n    rateLimitWindowMs: num('LOADTEST_RATE_LIMIT_WINDOW_MS', 60_000),\n    rateLimitStartMs: num('LOADTEST_RATE_LIMIT_START_MS', 10_000),\n    rateLimitWriteBucket: num('LOADTEST_RATE_LIMIT_WRITE_BUCKET', 0),\n    trustProxy: parseBool(env.LOADTEST_TRUST_PROXY),\n    shutdownTimeoutMs: num('LOADTEST_SHUTDOWN_TIMEOUT_MS', 10_000),\n  };\n  cachedEnv = cfg;\n  return cfg;\n}\n\n// ─── Env fail-fast validation (T-03) ────────────────────────────────────────\n\nexport interface EnvProblem {\n  key: string;\n  message: string;\n  severity: 'error' | 'warning';\n}\n\n/**\n * Validate env REQUIRED keys (T-03, Q-2). KHÔNG gọi trong getEnv() — worker.ts:11\n * gọi getEnv() trong child process không có DB/OTP; validate chỉ ở server.ts startup.\n * Strict khi: opts.production (NODE_ENV=production) HOẶC env.dbRequired (mặc định true).\n * Trả về danh sách vấn đề — caller (server.ts) log + exit khi có severity='error'.\n */\nexport function validateEnv(env: LoadTestEnv, opts: { production?: boolean } = {}): EnvProblem[] {\n  const production = opts.production ?? process.env.NODE_ENV === 'production';\n  const problems: EnvProblem[] = [];\n  const err = (key: string, message: string) => problems.push({ key, message, severity: 'error' });\n  const warn = (key: string, message: string) => problems.push({ key, message, severity: 'warning' });\n\n  // LOADTEST_DATABASE_URL — bắt buộc khi dbRequired hoặc production (Q-2)\n  if (env.dbRequired || production) {\n    if (!env.databaseUrl || isKnownBadDbUrl(env.databaseUrl)) {\n      err(\n        'LOADTEST_DATABASE_URL',\n        'bắt buộc cấu hình thật khi LOADTEST_DB_REQUIRED=true (hoặc production) — đang thiếu/placeholder/default credential',\n      );\n    }\n  }\n  if (env.databaseUrl && !/^postgres(ql)?:\\/\\//.test(env.databaseUrl)) {\n    err('LOADTEST_DATABASE_URL', `phải bắt đầu bằng postgres:// hoặc postgresql:// (hiện: ${redactUrl(env.databaseUrl)}...)`);\n  }\n\n  // LOADTEST_OTP_SECRET — ≥ 32 ký tự (seed OTP register — E1)\n  if (env.otpSecret && env.otpSecret.length <"+" 32) {\n    err('LOADTEST_OTP_SECRET', `phải ≥ 32 ký tự (hiện ${env.otpSecret.length})`);\n  } else if (!env.otpSecret) {\n    if (production) err('LOADTEST_OTP_SECRET', 'bắt buộc trong production (register sẽ fail — E1)');\n    else warn('LOADTEST_OTP_SECRET', 'thiếu — register sẽ fail (cần set trong loadtest/.env)');\n  }\n\n  // LOADTEST_AUTH_SECRET — ≥ 32 ký tự; production bắt buộc (auth.ts fallback tự sinh chỉ dev)\n  if (env.authSecret && env.authSecret.length <"+" 32) {\n    err('LOADTEST_AUTH_SECRET', `phải ≥ 32 ký tự (hiện ${env.authSecret.length})`);\n  } else if (!env.authSecret) {\n    if (production) err('LOADTEST_AUTH_SECRET', 'bắt buộc trong production (auth.ts fallback tự sinh chỉ dành cho dev)');\n    else warn('LOADTEST_AUTH_SECRET', 'thiếu — sẽ dùng fallback tự sinh (dev-only)');\n  }\n\n  // LOADTEST_REDIS_URL — nếu set phải đúng prefix\n  if (env.redisUrl && !/^redis(s)?:\\/\\//.test(env.redisUrl)) {\n    err('LOADTEST_REDIS_URL', `phải bắt đầu bằng redis:// hoặc rediss:// (hiện: ${redactUrl(env.redisUrl)}...)`);\n  }\n\n  return problems;\n}\n\n// ─── Validation ─────────────────────────────────────────────────────────────\n\nexport interface ValidationResult {\n  ok: boolean;\n  errors: string[];\n  warnings: string[];\n}\n\n/** Validate cấu hình run (bắt buộc trước mọi start). */\nexport function validateRunRequest(req: StartRunRequest, env: LoadTestEnv): ValidationResult {\n  const errors: string[] = [];\n  const warnings: string[] = [];\n\n  const gateway = normalizeUrl(req.gatewayUrl);\n  if (!gateway) errors.push('gatewayUrl bắt buộc');\n  else if (!env.allowlist.includes(gateway)) {\n    errors.push(\n      `Gateway ${gateway} KHÔNG nằm trong allowlist test. Chỉ được chạy: ${env.allowlist.join(', ')}`,\n    );\n  }\n\n  if (!Number.isInteger(req.targetUsers) || req.targetUsers <"+" 1000) {\n    errors.push('targetUsers phải ≥ 1000');\n  } else if (req.targetUsers > env.maxTarget) {\n    errors.push(\n      `targetUsers ${req.targetUsers} vượt giới hạn an toàn ${env.maxTarget} (preset 1M/10M cần cluster — v1.1). ` +\n        `Override bằng LOADTEST_MAX_TARGET nếu thực sự có hạ tầng.`,\n    );\n  }\n\n  if (!Number.isFinite(req.durationMin) || req.durationMin <"+"= 0) {\n    errors.push('durationMin phải > 0');\n  } else if (req.durationMin > env.maxDurationMin) {\n    errors.push(\n      `durationMin ${req.durationMin} phút vượt tối đa ${env.maxDurationMin} phút (access token TTL 1h — PRD §5.3).`,\n    );\n  }\n\n  if (!Number.isFinite(req.rampRate) || req.rampRate <"+"= 0) {\n    errors.push('rampRate phải > 0');\n  } else if (req.rampRate > 2000) {\n    warnings.push('rampRate > 2000/s có thể bão hòa event loop tool và matching engine (~100 user/s chat).');\n  }\n\n  const profile = req.profile;\n  if (!profile) errors.push('profile bắt buộc');\n  else {\n    const sum = profile.chat + profile.read + profile.comment + profile.like + profile.view;\n    if (Math.abs(sum - 100) > 0.001) {\n      errors.push(`Tổng profile = ${sum}% — phải đúng 100%`);\n    }\n    if (profile.chat > 0 && req.targetUsers > 10_000) {\n      // 10k chat user @ 100/s matching → ~100s seat; với target lớn cần thời gian\n      const seatSec = req.targetUsers / 100;\n      if (seatSec > req.durationMin * 60) {\n        warnings.push(\n          `Matching engine trần ~100 user/s: seat ${req.targetUsers} chat user mất ~${Math.ceil(seatSec / 60)} phút > duration.`,\n        );\n      }\n    }\n    for (const k of ['chat', 'read', 'comment', 'like', 'view'] as const) {\n      if (!Number.isFinite(profile[k]) || ansition(from, to)) {\n    throw new Error(`Bất hợp lệ: phase ${from} → ${to}`);\n  }\n  return to;\n}\n\n/**\n * Quyết định dừng tự động (AC1.3 / UX-FLOW E1-E3):\n * - register fail > 50% (cửa sổ 60s)\n * - connect fail > 30% (cửa sổ 60s)\n * - > 50% worker chết trong 60s (kiểm tra ngoài — ở coordinator)\n */\nexport interface AutoStopInput {\n  phase: RunPhase;\n  registerFailRate: number; // 0-100\n  connectFailRate: number; // 0-100\n  registeredTotal: number; // tổng đã thử register\n  connectTotal: number; // tổng đã thử connect\n}\n\nexport function decideAutoStop(input: AutoStopInput): StopDecision {\n  if (input.registerFailRate > 50 && input.registeredTotal >= 10) {\n    return { stop: true, reason: `auto-stop: register fail ${input.registerFailRate.toFixed(0)}% > 50% (E1)` };\n  }\n  if (input.connectFailRate > 30 && input.connectTotal >= 10) {\n    return { stop: true, reason: `auto-stop: connect fail ${input.connectFailRate.toFixed(0)}% > 30% (E2)` };\n  }\n  return { stop: false };\n}\n\n/** Pha cuối dựa trên cách run kết thúc: natural → finished, auto lỗi → error, manual → stopped. */\nexport function endPhaseFromStop(\n  kind: 'natural' | 'auto' | 'manual',\n  reason?: string,\n): { phase: RunPhase; stopReason?: string } {\n  if (kind === 'natural') return { phase: 'finished', stopReason: reason };\n  if (kind === 'manual') return { phase: 'stopped', stopReason: reason ?? 'run bị dừng thủ công (kill-switch)' };\n  return { phase: 'error', stopReason: reason ?? 'run tự dừng do lỗi' };\n}\n\n/** Gộp N worker tick → LoadTestTick 1s (DB-1 aggregation). */\nexport interface AggregatedTick {\n  tick: LoadTestTick;\n  /** Histogram gộp theo action (dùng cho report). */\n  perActionHistograms: Record<"+"string, number[]>;\n  /** Kết quả ok/fail theo action (cumulative — report AC6.1). */\n  actionOk: Partial<"+"Record<"+"ActionType, number>>;\n  actionFail: Partial<"+"Record<"+"ActionType, number>>;\n  /** Error samples gần nhất (tối đa 20). */\n  errorSamples: ErrorSample[];\n}\n\nexport function aggregateTicks(runId: string, ts: number, elapsedSec: number, phase: RunPhase, ticks: WorkerTick[], _prev?: AggregatedTick): AggregatedTick {\n  const C = {\n    usersCreated: 0, usersConnected: 0, usersActive: 0, usersQueued: 0, usersInRoom: 0,\n    actionsTotal: 0, successTotal: 0, failTotal: 0, echoOk: 0, echoSent: 0,\n    droppedOutbox: 0, reconnectCount: 0, rateLimitedNoEcho: 0,\n  };\n  const actionsPerSec: Partial<"+"Record<"+"ActionType, number>> = {};\n  const actionOk: Partial<"+"Record<"+"ActionType, number>> = {};\n  const actionFail: Partial<"+"Record<"+"ActionType, number>> = {};\n  const errors: Record<"+"string, number> = {};\n  const histograms: Record<"+"string, number[]> = {};\n  let histBucketCount = 0;\n  let cpuSum = 0;\n  let cpuN = 0;\n  let errorSamples: ErrorSample[] = [];\n\n  for (const t of ticks) {\n    C.usersCreated += t.counters.usersCreated;\n    C.usersConnected += t.counters.usersConnected;\n    C.usersActive += t.counters.usersActive;\n    C.usersQueued += t.counters.usersQueued;\n    C.usersInRoom += t.counters.usersInRoom;\n    C.actionsTotal += t.counters.actionsTotal;\n    C.successTotal += t.counters.successTotal;\n    C.failTotal += t.counters.failTotal;\n    C.echoOk += t.counters.echoOk;\n    C.echoSent += t.counters.echoSent;\n    C.droppedOutbox += t.counters.droppedOutbox;\n    C.reconnectCount += t.counters.reconnectCount;\n    C.rateLimitedNoEcho += t.counters.rateLimitedNoEcho;\n\n    for (const action of ACTION_TYPES) {\n      const v = t.actionsPerSec[action];\n      if (v) actionsPerSec[action] = (actionsPerSec[action] ?? 0) + v;\n    }\n    for (const action of ACTION_TYPES) {\n      const ok = t.actionOk?.[action];\n      if (ok) actionOk[action] = (actionOk[action] ?? 0) + ok;\n      const fail = t.actionFail?.[action];\n      if (fail) actionFail[action] = (actionFail[action] ?? 0) + fail;\n    }\n    for (const [code, count] of Object.entries(t.errors)) errors[code] = (errors[code] ?? 0) + count;\n    if (t.histograms) {\n      for (const [action, buckets] of Object.entries(t.histograms)) {\n        const target = (histograms[action] ??= new Array(t.histogramBucketCount || 0).fill(0));\n        for (let i = 0; i <"+" Math.min(buckets.length, target.length); i++) target[i] += buckets[i];\n      }\n      histBucketCount = Math.max(histBucketCount, t.histogramBucketCount);\n    }\n    if (t.cpuPct > 0) {\n      cpuSum += t.cpuPct;\n      cpuN++;\n    }\n    if (t.errorSamples?.length) {\n      errorSamples = [...t.errorSamples, ...errorSamples].slice(0, 20);\n    }\n  }\n\n  // Latency tổng từ histogram gộp (P50/P95/P99 toàn run — UI-SPEC tick.latency).\n  const totalHist = new BucketedHistogram();\n  for (const buckets of Object.values(histograms)) totalHist.merge({ buckets });\n  const q = totalHist.quantiles();\n\n  const successTotal = C.successTotal + C.failTotal;\n  const echoTotal = C.echoSent;\n\n  const topErrors = Object.entries(errors)\n    .map(([code, count]) => ({ code, count }))\n    .sort((a, b) => b.count - a.count)\n    .slice(0, 10);\n\n  const tick: LoadTestTick = {\n    type: 'tick',\n    runId,\n    ts,\n    phase,\n    elapsedSec,\n    counters: {\n      usersCreated: C.usersCreated,\n      usersConnected: C.usersConnected,\n      usersActive: C.usersActive,\n      usersQueued: C.usersQueued,\n      usersInRoom: C.usersInRoom,\n      actionsTotal: C.actionsTotal,\n      successTotal: C.successTotal,\n      failTotal: C.failTotal,\n      echoOk: C.echoOk,\n      echoSent: C.echoSent,\n      queueCount: 0, // coordinator bổ sung từ Redis (bên ngoài — vì pure)\n      roomCount: Math.round(C.usersInRoom / 6),\n      droppedOutbox: C.droppedOutbox,\n      reconnectCount: C.reconnectCount,\n      rateLimitedNoEcho: C.rateLimitedNoEcho,\n    },\n    rates: {\n      successRate: successTotal > 0 ? Math.round((C.successTotal / successTotal) * 1000) / 10 : 100,\n      echoRate: echoTotal > 0 ? Math.round((C.echoOk / echoTotal) * 1000) / 10 : 100,\n    },\n    actionsPerSec,\n    latency: { p50: q.p50, p95: q.p95, p99: q.p99 },\n    errors: topErrors,\n    server: { wsConnections: 0, wsMessagesEmitted: 0, wsMessagesPerSec: 0 },\n    workers: { alive: ticks.length, total: ticks.length, cpuAvg: cpuN > 0 ? Math.round(cpuSum / cpuN) : 0 },\n  };\n\n  return { tick, perActionHistograms: histograms, actionOk, actionFail, errorSamples };\n}\n\n/** Tính throughput peak từ chuỗi tick (dùng report). */\nexport function peakThroughput(actionsPerSecSeries: number[]): number {\n  return actionsPerSecSeries.reduce((m, v) => Math.max(m, v), 0);\n}\n"},"loadtest/report.ts":{"language":"typescript","mutants":[{"id":"771","mutatorName":"ArithmeticOperator","replacement":"b.count + a.count","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":38,"line":72},"start":{"column":21,"line":72}}},{"id":"943","mutatorName":"BlockStatement","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":6,"line":208},"start":{"column":52,"line":201}}},{"id":"944","mutatorName":"ArithmeticOperator","replacement":"i + start","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":28,"line":202},"start":{"column":19,"line":202}}},{"id":"945","mutatorName":"ConditionalExpression","replacement":"true","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":24,"line":203},"start":{"column":11,"line":203}}},{"id":"946","mutatorName":"ConditionalExpression","replacement":"false","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":24,"line":203},"start":{"column":11,"line":203}}},{"id":"947","mutatorName":"EqualityOperator","replacement":"len >= bestLen","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":24,"line":203},"start":{"column":11,"line":203}}},{"id":"948","mutatorName":"EqualityOperator","replacement":"len <"+"= bestLen","status":"NoCoverage", me":"StringLiteral","replacement":"\"\"","status":"Survived","static":false,"testsCompleted":1,"coveredBy":["90"],"location":{"end":{"column":87,"line":308},"start":{"column":81,"line":308}}},{"id":"1048","mutatorName":"StringLiteral","replacement":"``","statusReason":"expected '' to be 'C:\\Users\\Admin\\AppData\\Local\\Temp\\lt-…' // Object.is equality","status":"Killed","static":false,"testsCompleted":1,"killedBy":["90"],"coveredBy":["90"],"location":{"end":{"column":59,"line":309},"start":{"column":35,"line":309}}},{"id":"1049","mutatorName":"StringLiteral","replacement":"\"\"","status":"Survived","static":false,"testsCompleted":1,"coveredBy":["90"],"location":{"end":{"column":96,"line":309},"start":{"column":90,"line":309}}},{"id":"1050","mutatorName":"StringLiteral","replacement":"``","status":"Survived","static":false,"testsCompleted":1,"coveredBy":["90"],"location":{"end":{"column":36,"line":310},"start":{"column":16,"line":310}}},{"id":"1051","mutatorName":"BlockStatement","replacement":"{}","statusReason":"expected undefined to be '' // Object.is equality","status":"Killed","static":false,"testsCompleted":1,"killedBy":["91"],"coveredBy":["91"],"location":{"end":{"column":4,"line":315},"start":{"column":15,"line":312}}},{"id":"1052","mutatorName":"StringLiteral","replacement":"``","status":"Survived","static":false,"testsCompleted":1,"coveredBy":["91"],"location":{"end":{"column":53,"line":313},"start":{"column":16,"line":313}}},{"id":"1053","mutatorName":"StringLiteral","replacement":"\"Stryker was here!\"","statusReason":"expected 'Stryker was here!' to be '' // Object.is equality","status":"Killed","static":false,"testsCompleted":1,"killedBy":["91"],"coveredBy":["91"],"location":{"end":{"column":14,"line":314},"start":{"column":12,"line":314}}}],"source":"/**\n * MAYogu LoadTest Tool — Report (RE-1..RE-3): summary + latency P50/P95/P99 theo action\n * + bottleneck detector (AC6.2) + export JSON/Markdown/CSV.\n */\n\nimport * as fs from 'node:fs';\nimport * as path from 'node:path';\nimport type { LoadTestTick, RunConfig, RunPhase } from './types';\nimport type { ActionHistograms } from './metrics';\nimport type { RunReport, ActionReport, BottleneckCandidate } from './types';\nimport { ltLog } from './util';\n\nexport interface ReportInput {\n  runId: string;\n  status: 'finished' | 'stopped' | 'error';\n  startAt: number;\n  endAt: number;\n  config: RunConfig;\n  tickHistory: LoadTestTick[];\n  perActionHistograms: ActionHistograms;\n  /** ok/fail theo action (cumulative) — per-action success rate thật (AC6.1). */\n  actionOk: Record<"+"string, number>;\n  actionFail: Record<"+"string, number>;\n  maxConnected: number;\n  maxActive: number;\n  maxQueue: number;\n  peakActionsPerSec: number;\n  provisioned: number;\n  stopReason?: string;\n  /** Số lần NO_POST_FIXTURE — coordinator đếm từ raw worker errors (T-07/S-12). */\n  noPostFixtureSkipped?: number;\n}\n\nexport function buildReport(input: ReportInput): RunReport {\n  const history = input.tickHistory;\n  const last = history[history.length - 1];\n  const c = last?.counters ?? {\n    usersCreated: 0, usersConnected: 0, usersActive: 0, actionsTotal: 0,\n    successTotal: 0, failTotal: 0, echoOk: 0, echoSent: 0, queueCount: 0,\n  };\n  const durationSec = Math.max(1, Math.round((input.endAt - input.startAt) / 1000));\n  const successTotal = c.successTotal + c.failTotal;\n\n  // Per-action từ histogram cumulative + per-action ok/fail thật\n  const perAction: ActionReport[] = [];\n  for (const action of input.perActionHistograms.keys()) {\n    const h = input.perActionHistograms.get(action)!;\n    const q = h.quantiles();\n    const ok = input.actionOk[action] ?? 0;\n    const fail = input.actionFail[action] ?? 0;\n    const actionTotal = ok + fail;\n    perAction.push({\n      action: action as ActionReport['action'],\n      count: h.getCount(),\n      success: ok,\n      fail,\n      successRate: actionTotal > 0 ? Math.round((ok / actionTotal) * 1000) / 10 : 100,\n      avgMs: q.avg,\n      p50Ms: q.p50,\n      p95Ms: q.p95,\n      p99Ms: q.p99,\n    });\n  }\n  perAction.sort((a, b) => b.count - a.count);\n\n  const errorsMap = new Map<"+"string, number>();\n  for (const t of history) {\n    for (const e of t.errors) errorsMap.set(e.code, (errorsMap.get(e.code) ?? 0) + e.count);\n  }\n  const errors = [...errorsMap.entries()]\n    .map(([code, count]) => ({ code, count }))\n    .sort((a, b) => b.count - a.count)\n    .slice(0, 20);\n\n  // T-07/S-12: NO_POST_FIXTURE — feed trống, không phải lỗi hệ thống; báo rõ trong report.\n  const noPostFixtureSkipped =\n    input.noPostFixtureSkipped ??\n    history.reduce(\n      (acc, t) => acc + t.errors.filter((e) => e.code === 'NO_POST_FIXTURE').reduce((a, e) => a + e.count, 0),\n      0,\n    );\n\n  const bottleneckInput = {\n    history,\n    echoOk: c.echoOk,\n    echoSent: c.echoSent,\n    config: input.config,\n    workerCpu: history.slice(-60).reduce((a, t) => a + t.workers.cpuAvg, 0) / Math.max(1, history.slice(-60).length),\n  };\n  const bottlenecks = detectBottlenecks(bottleneckInput);\n\n  return {\n    runId: input.runId,\n    status: input.status,\n    startAt: input.startAt,\n    endAt: input.endAt,\n    durationSec,\n    config: input.config,\n    summary: {\n      usersCreated: input.provisioned,\n      usersConnectedMax: input.maxConnected,\n      usersActiveMax: input.maxActive,\n      actionsTotal: c.actionsTotal,\n      successTotal: c.successTotal,\n      failTotal: c.failTotal,\n      successRate: successTotal > 0 ? Math.round((c.successTotal / successTotal) * 1000) / 10 : 100,\n      echoOk: c.echoOk,\n      echoSent: c.echoSent,\n      echoRate: c.echoSent > 0 ? Math.round((c.echoOk / c.echoSent) * 1000) / 10 : 100,\n      throughputAvg: Math.round(c.actionsTotal / durationSec),\n      throughputPeak: input.peakActionsPerSec,\n      queueCountPeak: input.maxQueue,\n    },\n    perAction,\n    errors,\n    bottlenecks,\n    stopReason: input.stopReason,\n    noPostFixtureSkipped,\n  };\n}\n\n// ─── Bottleneck detector (AC6.2) ───────────────────────────────────────────\n\ninterface BottleneckInput {\n  history: LoadTestTick[];\n  echoOk: number;\n  echoSent: number;\n  config: RunConfig;\n  workerCpu: number;\n}\n\nexport function detectBottlenecks(input: BottleneckInput): BottleneckCandidate[] {\n  const out: BottleneckCandidate[] = [];\n  const h = input.history;\n  if (h.length <"+" 5) return out;\n\n  const seriesOf = (pick: (t: LoadTestTick) => number): { ts: number; value: number }[] =>\n    h.map((t) => ({ ts: t.ts, value: pick(t) }));\n\n  // 1. Chat echo rate <"+" 95%\n  if (input.echoSent >= 100) {\n    const echoRate = (input.echoOk / input.echoSent) * 100;\n    if (echoRate <"+" 95) {\n      out.push({\n        level: echoRate <"+" 90 ? 'High' : 'Med',\n        title: `Chat echo rate ${echoRate.toFixed(1)}% (<"+" 95% dự kiến)`,\n        detail: 'Nghi ngờ rate-limit chat (1 msg/2s silent drop) hoặc pipeline Kafka chậm — PRD §5.3 tách rate-limited khỏi lỗi thật.',\n        evidence: seriesOf((t) => (t.counters.echoSent > 0 ? (t.counters.echoOk / t.counters.echoSent) * 100 : 100)).slice(-120),\n      });\n    }\n  }\n\n  // 2. Queue-count tăng liên tục > 5 phút → matching trần ~100 user/s\n  const queueSeries = seriesOf((t) => t.counters.queueCount);\n  const longestRun = longestNonDecreasingRun(queueSeries);\n  if (longestRun.seconds >= 300 && longestRun.growth > 50) {\n    out.push({\n      level: longestRun.seconds >= 600 ? 'High' : 'Med',\n      title: `Queue-count tăng liên tục ${Math.round(longestRun.seconds / 60)} phút (${Math.round(longestRun.growth)} user)`,\n      detail: 'Matching engine trần ~100 user/s (MAX_POP=200/tick 2s) — user vào phòng chậm hơn ramp.',\n      evidence: queueSeries.slice(-600),\n    });\n  }\n\n  // 3. P95 tăng > 2× so với 5 phút đầu (nghi DB/Kafka)\n  const p95Series = seriesOf((t) => t.latency.p95);\n  const first5 = p95Series.filter((p) => p.ts - h[0].ts <"+"= 300_000);\n  const last5 = p95Series.slice(-300);\n  if (first5.length >= 30 && last5.length >= 30) {\n    const avg = (arr: { value: number }[]) => arr.reduce((a, p) => a + p.value, 0) / arr.length;\n    const f = avg(first5);\n    const l = avg(last5);\n    if (f > 50 && l > f * 2) {\n      out.push({\n        level: 'Med',\n        title: `Latency P95 tăng ${(l / Math.max(1, f)).toFixed(1)}× so với 5 phút đầu (${Math.round(f)}ms → ${Math.round(l)}ms)`,\n        detail: 'Nghi ngờ DB/Kafka tích tụ dưới tải — xem chart latency để xác định vùng.',\n        evidence: p95Series.slice(-600),\n      });\n    }\n  }\n\n  // 4. Worker CPU > 85% (tool-side bottleneck)\n  if (input.workerCpu > 85 && input.history.length >= 30) {\n    out.push({\n      level: 'Med',\n      title: `Worker CPU trung bình ${Math.round(input.workerCpu)}% (> 85%)`,\n      detail: 'Tool-side quá tải — giảm socket/worker hoặc tăng worker count. Số liệu có thể thiếu chính xác.',\n      evidence: seriesOf((t) => t.workers.cpuAvg).slice(-120),\n    });\n  }\n\n  return out;\n}\n\n/** Tìm đoạn dài nhất không giảm (cho phép nhiễu ±1) — queue tăng liên tục. */\nfunction longestNonDecreasingRun(series: { value: number }[]): { seconds: number; growth: number } {\n  let bestLen = 0, bestGrowth = 0;\n  let start = 0;\n  for (let i = 1; i <"+" series.length; i++) {\n    if (series[i].value <"+" series[i - 1].value - 1) {\n      const len = i - start;\n      if (len > bestLen) {\n        bestLen = len;\n        bestGrowth = series[i - 1].value - series[start].value;\n      }\n      start = i;\n    }\n  }\n  const len = series.length - start;\n  if (len > bestLen) {\n    bestLen = len;\n    bestGrowth = series[series.length - 1].value - series[start].value;\n  }\n  return { seconds: bestLen, growth: bestGrowth };\n}\n\n// ─── Export (RE-3) ─────────────────────────────────────────────────────────\n\nfunction formatMs(ms: number): string {\n  if (ms >= 1000) return (ms / 1000).toFixed(2) + 's';\n  return Math.round(ms) + 'ms';\n}\n\nexport function reportToMarkdown(r: RunReport): string {\n  const s = r.summary;\n  const lines: string[] = [\n    `# MAYogu LoadTest Report — ${r.runId}`,\n    '',\n    `**Status**: ${r.status}${r.stopReason ? ` — ${r.stopReason}` : ''}`,\n    `**Thời gian**: ${new Date(r.startAt).toISOString()} → ${new Date(r.endAt).toISOString()} (thực tế ${Math.round(r.durationSec / 60)}m ${r.durationSec % 60}s)`,\n    '',\n    '## Summary',\n    '',\n    `| Metric | Giá trị |`,\n    `|---|---|`,\n    `| User đã tạo | ${s.usersCreated.toLocaleString()} |`,\n    `| Connect max | ${s.usersConnectedMax.toLocaleString()} |`,\n    `| Active max | ${s.usersActiveMax.toLocaleString()} |`,\n    `| Actions | ${s.actionsTotal.toLocaleString()} |`,\n    `| Success rate | ${s.successRate}% |`,\n    `| Throughput avg / peak | ${s.throughputAvg}/s · ${s.throughputPeak}/s |`,\n    `| Chat echo rate | ${s.echoRate}% (${s.echoOk}/${s.echoSent}) |`,\n    `| Queue peak | ${s.queueCountPeak} |`,\n    '',\n    ...(r.noPostFixtureSkipped && r.noPostFixtureSkipped > 0\n      ? [\n          '## Không có post fixture — bỏ qua bước đọc feed',\n          '',\n          `- \\`NO_POST_FIXTURE\\`: ${r.noPostFixtureSkipped.toLocaleString()} lần — feed trống/chưa có post, các action \\`read\\`/\\`view\\`/\\`comment\\`/\\`like\\` bị bỏ qua. Seed nội dung trước khi chạy run.`,\n          '',\n        ]\n      : []),\n    '## Latency theo action',\n    '',\n    '| action | p50 | p95 | p99 | count |',\n    '|---|---|---|---|---|',\n    ...r.perAction.map(\n      (a) => `| ${a.action} | ${formatMs(a.p50Ms)} | ${formatMs(a.p95Ms)} | ${formatMs(a.p99Ms)} | ${a.count.toLocaleString()} |`,\n    ),\n    '',\n    '## Bottleneck candidates',\n    '',\n    ...(r.bottlenecks.length\n      ? r.bottlenecks.map((b, i) => `${i + 1}. **[${b.level}]** ${b.title}\\n   ${b.detail}`)\n      : ['Không phát hiện bottleneck vượt ngưỡng.']),\n    '',\n    '## Top errors',\n    '',\n    ...(r.errors.length ? r.errors.map((e) = ine":184}}},{"id":"735","mutatorName":"ArithmeticOperator","replacement":"fails * this.entries.length","statusReason":"expected 600 to be close to 66.7, received difference is 533.3, but expected 0.05","status":"Killed","static":false,"testsCompleted":1,"killedBy":["134"],"coveredBy":["134","137","138"],"location":{"end":{"column":40,"line":184},"start":{"column":13,"line":184}}},{"id":"736","mutatorName":"BlockStatement","replacement":"{}","statusReason":"actual value must be number or bigint, received \"undefined\"","status":"Killed","static":false,"testsCompleted":1,"killedBy":["136"],"coveredBy":["136","137"],"location":{"end":{"column":4,"line":189},"start":{"column":22,"line":187}}}],"source":"/**\n * MAYogu LoadTest Tool — metrics: log-scale histogram (P50/P95/P99) + aggregation.\n *\n * - Histogram dùng bucket log-scale cố định (1ms → 60s, 48 bucket) — O(1) insert,\n *   memory cố định, merge nhanh giữa worker → coordinator (DB-1).\n * - Không giữ sample thô → an toàn ở 100k events/s (AC5.4).\n */\n\nexport const HISTOGRAM_BUCKETS = 48;\nexport const HISTOGRAM_MIN_MS = 1;\nexport const HISTOGRAM_MAX_MS = 60_000;\n\nexport interface Quantiles {\n  p50: number;\n  p95: number;\n  p99: number;\n  avg: number;\n  count: number;\n}\n\nexport class BucketedHistogram {\n  readonly buckets: number[];\n  private count = 0;\n  private sumMs = 0;\n\n  constructor(bucketCount = HISTOGRAM_BUCKETS) {\n    this.buckets = new Array(bucketCount).fill(0);\n  }\n\n  private static bucketIndex(valueMs: number): number {\n    const logMin = Math.log(HISTOGRAM_MIN_MS);\n    const logMax = Math.log(HISTOGRAM_MAX_MS);\n    const span = logMax - logMin;\n    const idx = Math.floor(((Math.log(Math.max(valueMs, HISTOGRAM_MIN_MS)) - logMin) / span) * HISTOGRAM_BUCKETS);\n    return Math.min(HISTOGRAM_BUCKETS - 1, Math.max(0, idx));\n  }\n\n  add(valueMs: number) {\n    const idx = BucketedHistogram.bucketIndex(valueMs);\n    this.buckets[idx] += 1;\n    this.count += 1;\n    this.sumMs += valueMs;\n  }\n\n  /** Giá trị đại diện giữa bucket (log-mid) — dùng ước lượng sum khi merge nguồn thô. */\n  private static bucketMidMs(idx: number): number {\n    const frac = (idx + 0.5) / HISTOGRAM_BUCKETS;\n    const logMin = Math.log(HISTOGRAM_MIN_MS);\n    const logMax = Math.log(HISTOGRAM_MAX_MS);\n    return Math.exp(logMin + frac * (logMax - logMin));\n  }\n\n  merge(other: { buckets: number[] } | BucketedHistogram) {\n    const isHist = other instanceof BucketedHistogram;\n    const ob = other.buckets;\n    for (let i = 0; i <"+" Math.min(ob.length, this.buckets.length); i++) this.buckets[i] += ob[i];\n    if (isHist) {\n      this.count += (other as BucketedHistogram).getCount();\n      this.sumMs += (other as BucketedHistogram).getSum();\n    } else {\n      for (let i = 0; i <"+" ob.length; i++) {\n        if (ob[i]) {\n          this.sumMs += BucketedHistogram.bucketMidMs(i) * ob[i];\n          this.count += ob[i];\n        }\n      }\n    }\n  }\n\n  getCount(): number {\n    return this.count;\n  }\n\n  getSum(): number {\n    return this.sumMs;\n  }\n\n  quantile(q: number): number {\n    if (this.count === 0) return 0;\n    const target = q * this.count;\n    let cum = 0;\n    for (let i = 0; i <"+" this.buckets.length; i++) {\n      cum += this.buckets[i];\n      if (cum >= target) {\n        // trả về giá trị đại diện đầu bucket (log-mid) — đủ chính xác cho P50/P95/P99\n        const frac = i / this.buckets.length;\n        const logMin = Math.log(HISTOGRAM_MIN_MS);\n        const logMax = Math.log(HISTOGRAM_MAX_MS);\n        return Math.round(Math.exp(logMin + frac * (logMax - logMin)));\n      }\n    }\n    return HISTOGRAM_MAX_MS;\n  }\n\n  quantiles(): Quantiles {\n    return {\n      p50: this.quantile(0.5),\n      p95: this.quantile(0.95),\n      p99: this.quantile(0.99),\n      avg: this.count > 0 ? Math.round(this.sumMs / this.count) : 0,\n      count: this.count,\n    };\n  }\n\n  toJSON(): number[] {\n    return this.buckets;\n  }\n}\n\n/** Bộ histogram theo action + registry tên action cố định. */\nexport class ActionHistograms {\n  private map = new Map<"+"string, BucketedHistogram>();\n\n  add(action: string, valueMs: number) {\n    let h = this.map.get(action);\n    if (!h) {\n      h = new BucketedHistogram();\n      this.map.set(action, h);\n    }\n    h.add(valueMs);\n  }\n\n  mergeFrom(action: string, buckets: number[]) {\n    let h = this.map.get(action);\n    if (!h) {\n      h = new BucketedHistogram(buckets.length);\n      this.map.set(action, h);\n    }\n    h.merge({ buckets });\n  }\n\n  get(action: string): BucketedHistogram | undefined {\n    return this.map.get(action);\n  }\n\n  /** Gộp toàn bộ (cho latency tổng P50/P95/P99 toàn run — UI-SPEC tick.latency). */\n  mergedTotal(): BucketedHistogram {\n    const out = new BucketedHistogram();\n    for (const h of this.map.values()) out.merge(h);\n    return out;\n  }\n\n  keys(): string[] {\n    return [...this.map.keys()];\n  }\n\n  toJSON(): Record<"+"string, number[]> {\n    const out: Record<"+"string, number[]> = {};\n    for (const [k, h] of this.map) out[k] = h.buckets;\n    return out;\n  }\n}\n\n/** Counter tăng nhanh — đảm bảo không âm sau delta. */\nexport class Counter {\n  private v = 0;\n  inc(n = 1) {\n    this.v += n;\n  }\n  get(): number {\n    return this.v;\n  }\n  reset() {\n    this.v = 0;\n  }\n}\n\n/** Sliding window 60s cho auto-stop thresholds (register fail > 50% etc.). */\nexport class SlidingWindow {\n  private entries: { ts: number; ok: boolean }[] = [];\n  constructor(private windowMs = 60_000) {}\n\n  add(ok: boolean) {\n    this.entries.push({ ts: Date.now(), ok });\n    const cutoff = Date.now() - this.windowMs;\n    while (this.entries.length && this.entries[0].ts <"+" cutoff) this.entries.shift();\n  }\n\n  /** Tỷ lệ fail trong cửa sổ (0-100). 0 nếu chưa có dữ liệu. */\n  failRatePct(): number {\n    if (this.entries.length === 0) return 0;\n    let fails = 0;\n    for (const e of this.entries) if (!e.ok) fails++;\n    return (fails / this.entries.length) * 100;\n  }\n\n  get size(): number {\n    return this.entries.length;\n  }\n}\n"}},"schemaVersion":"1.0","thresholds":{"break":70,"high":80,"low":60},"testFiles":{"loadtest/__tests__/config.test.ts":{"tests":[{"id":"0","name":"config — env đọc env override + allowlist mặc định localhost"},{"id":"1","name":"config — env allowlist từ env phân tách phẩy, normalize ws→http"},{"id":"2","name":"config — validateRunRequest (SD-1 + giới hạn an toàn) chặn cứng gateway ngoài allowlist"},{"id":"3","name":"config — validateRunRequest (SD-1 + giới hạn an toàn) chấp nhận gateway trong allowlist"},{"id":"4","name":"config — validateRunRequest (SD-1 + giới hạn an toàn) chặn target > maxTarget (preset 1M/10M)"},{"id":"5","name":"config — validateRunRequest (SD-1 + giới hạn an toàn) chặn duration > 60 phút (access token 1h)"},{"id":"6","name":"config — validateRunRequest (SD-1 + giới hạn an toàn) chặn profile tổng ≠ 100%"},{"id":"7","name":"config — validateRunRequest (SD-1 + giới hạn an toàn) cảnh báo khi ramp chat vượt trần matching"},{"id":"8","name":"config — buildRunConfig resolve workerCount + durationSec + seed"},{"id":"9","name":"config — buildRunConfig auto workerCount theo target"},{"id":"10","name":"config — validateEnv (T-03 fail-fast) production + thiếu key → errors (DB required, OTP, AUTH)"},{"id":"11","name":"config — validateEnv (T-03 fail-fast) dev + dbRequired=false + thiếu key → không error (chỉ warning)"},{"id":"12","name":"config — validateEnv (T-03 fail-fast) dbRequired=true (mặc định) + placeholder DB URL → error"},{"id":"13","name":"config — validateEnv (T-03 fail-fast) sai prefix DB URL → error"},{"id":"14","name":"config — validateEnv (T-03 fail-fast) dev DB URL với username appuser + password thật → PASS (không false-positive — T-03)"},{"id":"15","name":"config — validateEnv (T-03 fail-fast) default credential cũ (appuser:secret) → error (T-03)"},{"id":"16","name":"config — validateEnv (T-03
