# nginx config cho chat-app production build (docker/Dockerfile.frontend stage 2).
#
# QUYẾT ĐỊNH KIẾN TRÚC (không đổi — DESIGN-prod-refactor §10 D-8):
#   - CSP có DUY NHẤT 1 nguồn = <meta http-equiv="Content-Security-Policy">
#     do Vite plugin inject vào index.html lúc BUILD (vite.config.ts `injectCspMeta`).
#     Nginx KHÔNG set header Content-Security-Policy — 2 nguồn CSP (meta + header)
#     sẽ INTERSECT (giao nhau) và chặn font/socket. Vì vậy:
#     KHÔNG thêm `add_header Content-Security-Policy ...` vào file này.
#   - Ngoại lệ: `X-Frame-Options` là directive header-ONLY (meta không enforce —
#     THREAT-MODEL residual D-10) → delegate riêng cho nginx ở đây.
#
# SPA fallback: `try_files $uri $uri/ /index.html;` BẮT BUỘC cho react-router
# (/chat, /loadtest, /login, ...) — F5/direct-nav mà thiếu fallback → 404.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Healthcheck (Docker HEALTHCHECK — không cần auth, không vào log) ──
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store";
        # Lặp lại security headers — xem comment "add_header inheritance" dưới.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 200 "ok\n";
    }

    # ── LoadTest backend (container `loadtest`, port 3401 — REST /api/loadtest/*,
    #    UI src/lib/loadtest-api.ts baseURL /api/loadtest same-origin). Pure HTTP,
    #    KHÔNG WebSocket → proxy_pass giữ nguyên URI (không trailing slash ở target).
    #    Server tự set CORS — qua proxy thì browser thấy same-origin, CORS không chặn.
    location ^~ /api/loadtest {
        proxy_pass http://loadtest:3401;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SPA fallback (CRITICAL — react-router routes) ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Assets hashed (Vite emits content-hashed tên file trong /assets/) ──
    # Cache 1 năm immutable — tên file đổi khi content đổi nên an toàn.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header INHERITANCE: location có add_header riêng KHÔNG kế thừa
        # add_header cấp server — phải lặp lại X-Frame-Options/nosniff ở đây,
        # nếu không response asset bị mất 2 header an toàn (FIX-4/T-12).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html KHÔNG cache — phải nhận bản build mới khi deploy.
    # HTML doc là response CHÍNH của SPA — security headers bắt buộc ở đây
    # (try_files internal redirect vào location này → server-level bị suppress).
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ── Clickjacking (frame-ancestors không enforce qua meta — D-10) ──
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip (text assets) ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/xml
        image/svg+xml;
}
